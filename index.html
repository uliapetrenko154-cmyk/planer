<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<meta name="description" content="Планер: неделя и дни, цели и карта желаний, мой рост. Личное пространство для планирования жизни.">
<meta name="theme-color" content="#f5f2ec">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Comfortaa:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{min-height:100%}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a week board — a side panel with the week's totals and goals,
   seven day columns with a completion ring each, and a review strip below.
   Side panel moves on top under 1100px; days stack into cards under 720px. */
:root{
  --bg:#f5f2ec;
  --surface:#fffdf9;
  --surface-2:#f0ece4;
  --line:#e4ded4;
  --line-2:#d0c7ba;
  --ink:#2a2521;
  --ink-2:#6b625a;
  --muted:#9d948a;
  --accent:#a99072;
  --accent-ink:#7a6750;
  --accent-soft:#efe7db;
  --track:#e9e3d9;
  --danger:#b4584a;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-brand:'Comfortaa','Manrope',system-ui,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1916; --surface:#242019; --surface-2:#2b2620; --line:#38322b; --line-2:#4b4339;
    --ink:#efe9e0; --ink-2:#b7aea2; --muted:#7f766c;
    --accent:#c2a98a; --accent-ink:#dcc7ab; --accent-soft:#352e26; --track:#342e27; --danger:#d4786a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1916; --surface:#242019; --surface-2:#2b2620; --line:#38322b; --line-2:#4b4339;
  --ink:#efe9e0; --ink-2:#b7aea2; --muted:#7f766c;
  --accent:#c2a98a; --accent-ink:#dcc7ab; --accent-soft:#352e26; --track:#342e27; --danger:#d4786a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,2.5vw,32px);padding-block:18px 48px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--font-brand);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:12.5px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .range{font-weight:700;font-size:16px;min-width:230px;text-align:center;font-variant-numeric:tabular-nums}
.weeknav .range small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:18px;line-height:1}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}
.pill{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--ink-2)}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.pill.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.status.saving .dot{animation:pulse 1s infinite}
.status.error{color:var(--danger)}
.status.error .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status.saving .dot{animation:none}.ring .pr{transition:none}}

/* ---------- example banner ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--accent-ink)}
.banner b{color:var(--ink)}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:256px minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;align-items:center;gap:16px}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:20px;font-weight:700;color:var(--muted);letter-spacing:0}
.hero .meta{color:var(--ink-2);font-size:13px;line-height:1.35}
.hero .meta b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 10px;min-width:0}
.stat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .k{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.2}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar.today{fill:var(--accent-ink)}
.chart .track{fill:var(--track)}
.chart text{font-family:var(--font-ui);fill:var(--ink-2);font-size:9.5px;font-weight:600}
.chart text.val{fill:var(--ink);font-size:9px;font-weight:700}
.chart text.wd.today{fill:var(--ink)}

/* goals + tasks share one row style */
.goals,.tasks{display:flex;flex-direction:column;gap:1px}
.goal,.task{display:flex;align-items:flex-start;gap:8px;min-height:32px;padding:2px 4px 2px 2px;border-radius:8px;position:relative}
.goal .check,.task .check{margin-top:7px}
.pristar{margin-top:8px}
.goal:hover,.task:hover{background:var(--surface-2)}
.check{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--line-2);border-radius:5px;background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s;margin:0}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translateY(-1px) rotate(-45deg)}
.txt{flex:1;min-width:0;border:0;background:transparent;padding:4px 2px;border-radius:4px;outline:0;resize:none;overflow:hidden;line-height:1.35;font-size:13.5px;display:block}
.txt::placeholder{color:var(--muted)}
.txt:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.done .txt{color:var(--muted);text-decoration:line-through}
.pri .txt{font-weight:700}
.tools{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .12s;background:var(--surface-2);border-radius:6px;padding-left:6px}
.goal:hover .tools,.task:hover .tools,.goal:focus-within .tools,.task:focus-within .tools{opacity:1;pointer-events:auto}
@media (hover:none){.tools{opacity:1;pointer-events:auto;background:transparent}.task .txt{padding-right:76px}.goal .txt{padding-right:28px}}
.tools button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:13px;line-height:1}
.tools button:hover{background:var(--surface);color:var(--ink)}
.tools button.on{color:var(--accent-ink)}
.tools button.del:hover{color:var(--danger)}
.pristar{color:var(--accent-ink);font-size:12px;flex:none;width:12px;text-align:center}
.add{display:flex;align-items:center;gap:8px;min-height:32px;padding:2px 4px 2px 2px}
.add .plus{width:17px;height:17px;border-radius:5px;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:13px;line-height:1;flex:none}
.add input{flex:1;min-width:0;border:0;background:transparent;padding:4px 2px;outline:0}
.add input::placeholder{color:var(--muted)}
.add:focus-within .plus{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- week overview: day cards ---------- */
.board{min-width:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px 12px;min-width:0;color:inherit;text-decoration:none;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--accent);box-shadow:0 8px 22px rgba(42,37,33,.08);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.today{box-shadow:0 0 0 2px var(--accent-soft)}
.card.past{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dhead .wd{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dhead .dt{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.today .dt{background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 9px}
.card .ring{border-bottom:0;padding:0}
.card .ring svg{width:56px;height:56px}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .35s ease}
.bar i.full{background:var(--accent-ink)}
.cmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);min-width:0}
.cmeta .dots{gap:2px}
.cmeta .dots button{width:9px;height:9px;pointer-events:none}
.card .open{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent-ink);display:flex;align-items:center;gap:4px}
.card .open::after{content:"→";transition:transform .15s}
.card:hover .open::after{transform:translateX(3px)}
.ring{display:flex;align-items:center;gap:10px;padding:2px 0 4px;border-bottom:1px solid var(--line)}
.ring svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--track);stroke-width:4.2}
.ring .pr{fill:none;stroke:var(--accent);stroke-width:4.2;stroke-linecap:round;transition:stroke-dasharray .35s ease}
.ring .pr.full{stroke:var(--accent-ink)}
.ring .num{font-weight:800;font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.ring .cap{font-size:11.5px;color:var(--muted);margin-top:3px}
.note{width:100%;border:0;border-top:1px solid var(--line);background:transparent;resize:none;padding:8px 2px 2px;font-size:12.5px;line-height:1.4;color:var(--ink-2);min-height:40px;outline:0;overflow:hidden}
.note::placeholder{color:var(--muted)}
.note:focus{color:var(--ink)}
.energy{display:flex;align-items:center;justify-content:space-between;gap:8px}
.energy .label{font-size:10.5px}
.dots{display:flex;gap:3px}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface)}
.dots button.on{background:var(--accent);border-color:var(--accent)}
.dots button:hover{border-color:var(--accent)}

/* ---------- day page ---------- */
.dayview{max-width:980px;margin:0 auto}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.daynav .pair{display:flex;gap:8px}
.pill.nav{display:inline-flex;align-items:center;gap:6px}
.pill .short{display:none}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.dayhead h2{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1}
.dayhead h2::first-letter{text-transform:uppercase}
.dayhead .when{color:var(--muted);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--ink);border-radius:999px;padding:3px 9px}
.dayhead .dsum{display:flex;gap:8px;flex-wrap:wrap}
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.dcard .label{margin-bottom:8px}
.daygrid .tasks{gap:2px}
.daygrid .task{min-height:36px}
.daygrid .txt{font-size:14.5px}
.daygrid .ring{border-bottom:0;padding:0;gap:14px}
.daygrid .ring svg{width:96px;height:96px}
.daygrid .ring .num{font-size:30px}
.daygrid .ring .cap{font-size:13px}
.daygrid .note{border-top:0;padding:4px 2px;min-height:72px;font-size:13.5px}
.daygrid .energy{justify-content:flex-start;gap:12px}
.daygrid .dots{gap:6px}
.daygrid .dots button{width:18px;height:18px}
.side{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);font-size:13px;padding:6px 2px 2px}

/* ---------- review ---------- */
.review{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.review h2{font-size:17px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.verdict{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-bottom:10px}
.summary{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;color:var(--ink-2);max-width:60ch}
.summary li{display:flex;gap:9px;align-items:baseline}
.summary li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.summary b{color:var(--ink)}
.transfer{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.transfer .hint{font-size:12.5px;color:var(--muted)}
.refl{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;resize:none;min-height:58px;outline:0;line-height:1.4;overflow:hidden}
.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field textarea::placeholder{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* ---------- responsive ---------- */
@media (max-width:1400px){
  .main{grid-template-columns:1fr}
  .panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.3fr);grid-template-areas:"hero stats chart goals";gap:24px;align-items:start}
  .p-hero{grid-area:hero}.p-stats{grid-area:stats}.p-chart{grid-area:chart}.p-goals{grid-area:goals}
  .stats{grid-template-columns:1fr;gap:6px}
  .stat{display:flex;align-items:baseline;gap:8px;padding:6px 10px}
  .stat .v{font-size:15px;min-width:34px}
  .days{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (max-width:960px){
  .panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hero chart" "stats chart" "goals goals";gap:18px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat{display:block;padding:9px 10px}
  .stat .v{font-size:17px}
}
@media (max-width:720px){
  .wrap{padding-block:14px 40px}
  .top{margin-bottom:14px}
  .weeknav{width:100%;justify-content:space-between}
  .weeknav .range{min-width:0;flex:1}
  .panel{grid-template-columns:1fr;grid-template-areas:"hero" "stats" "chart" "goals"}
  .days{grid-template-columns:1fr;gap:8px}
  .card{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ring head" "ring bar" "ring meta";column-gap:14px;row-gap:6px;align-items:center;padding:12px 14px}
  .card .ring{grid-area:ring;flex-direction:column;gap:0}
  .card .ring svg{width:52px;height:52px}
  .card .ring .num{font-size:14px}
  .card .ring .cap{display:none}
  .card .dhead{grid-area:head}
  .card .bar{grid-area:bar}
  .card .cmeta{grid-area:meta}
  .card .open{display:none}
  .review{grid-template-columns:1fr;padding:16px}
  .daygrid{grid-template-columns:1fr}
  .dayhead h2{font-size:24px}
  .pill .long{display:none}
  .pill .short{display:inline}
}

/* ================= app shell: top nav, bottom tab bar ================= */
.top{align-items:center}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav a{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav svg{width:16px;height:16px;flex:none}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;overflow:hidden;flex:none;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:72px;height:72px;font-size:26px}
.avatar.xl{width:96px;height:96px;font-size:34px}
.tabbar{display:none}
.weektools{display:flex;align-items:center;justify-content:center;margin-bottom:16px}

/* ================= home ================= */
.homehead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.homehead .hi{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.homehead .date{color:var(--muted);font-size:13px;margin-top:2px}
.homehead .date::first-letter{text-transform:uppercase}
.homehead .motiv{margin-top:8px;color:var(--accent-ink);font-size:14px;font-style:italic}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.widget.wide{grid-column:1/-1}
.whead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.whead .label{margin:0}
.whead a,.linkbtn{font-size:12.5px;font-weight:700;color:var(--accent-ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.whead a:hover,.linkbtn:hover{text-decoration:underline}
.wtoday{display:flex;gap:16px;align-items:flex-start}
.wtoday .ring{border-bottom:0;padding:0;flex:none}
.wtoday .ring svg{width:72px;height:72px}
.wtoday .list{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wweek{display:flex;gap:16px;align-items:center}
.wweek .chart{flex:1;min-width:0}
.wish-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wish-mini a{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;display:block;background:var(--accent-soft);text-decoration:none;color:inherit}
.wish-mini img{width:100%;height:100%;object-fit:cover;display:block}
.wish-mini .t{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish-mini .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}
.goalrow{display:flex;flex-direction:column;gap:5px}
.goalrow .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.goalrow .t b{font-weight:700}
.goalrow .t span{color:var(--muted);font-variant-numeric:tabular-nums}

/* ================= wish board ================= */
.wishhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.wishhead h2{font-family:var(--font-brand);font-size:28px;font-weight:700;margin:0;letter-spacing:-.01em}
.wishhead .tag{color:var(--muted);font-size:13px;margin-top:4px}
.wishhead .tag i{color:var(--accent-ink);font-style:italic}
.wishhead .years{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-left:8px;vertical-align:middle}
.wishgreet{color:var(--accent-ink);font-size:14px;margin:-4px 0 14px;font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chips .label{margin-right:4px}
.chip2{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.chip2:hover{border-color:var(--accent);color:var(--ink)}
.chip2.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip2 .cnt{font-size:11px;color:var(--muted);font-weight:700}
.chip2.on .cnt{color:var(--bg);opacity:.7}
.masonry{columns:4 220px;column-gap:14px}
.wish{break-inside:avoid;margin:0 0 14px;border-radius:18px;overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;display:block;width:100%;text-align:left;padding:0;color:inherit}
.wish:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(42,37,33,.14)}
.wish img{width:100%;display:block;aspect-ratio:var(--ar,4/5);object-fit:cover}
.wish .ph{aspect-ratio:var(--ar,4/5);display:grid;place-items:center;font-size:44px;background:linear-gradient(145deg,var(--accent-soft),var(--surface-2))}
.wish .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px}
.wish .ttl{font-weight:700;font-size:14px;line-height:1.3}
.wish .sub{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.wish .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:#2a2521;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.wish .badge.done{background:var(--accent);color:#fff}
.wish.isdone img,.wish.isdone .ph{filter:saturate(.6)}
.wish .pbar{height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.wish .pbar i{display:block;height:100%;background:var(--accent)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:none;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 18px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.emptyboard{border:1.5px dashed var(--line-2);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.emptyboard b{color:var(--ink);font-size:16px}

/* ================= modal / sheet ================= */
.overlay{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:rise .22s ease;display:flex;flex-direction:column}
.sheet.wide{width:min(900px,100%)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.shead h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 20px 20px}
.sfoot .grow{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.frow{display:flex;flex-direction:column;gap:5px}
.frow input[type=text],.frow input[type=date],.frow select,.frow textarea,.in{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 11px;outline:0;font:inherit;color:inherit}
.frow input:focus,.frow select:focus,.frow textarea:focus,.in:focus{border-color:var(--accent);background:var(--surface)}
.frow textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:1.5px dashed var(--line-2);border-radius:14px;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;position:relative;overflow:hidden;background:var(--bg)}
.drop.has{border-style:solid;min-height:0}
.drop img{width:100%;max-height:320px;object-fit:cover;display:block}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .hintimg{padding:24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop .hintimg svg{width:28px;height:28px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.detail .pic{border-radius:14px;overflow:hidden;background:var(--accent-soft);min-height:200px;display:grid;place-items:center;font-size:64px}
.detail .pic img{width:100%;height:100%;object-fit:cover;display:block;max-height:460px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:8px;min-height:32px;padding:2px 4px 2px 2px;border-radius:8px}
.step:hover{background:var(--surface-2)}
.step .t{flex:1;min-width:0;font-size:14px}
.step.done .t{color:var(--muted);text-decoration:line-through}
.step .d{font-size:11.5px;color:var(--muted);white-space:nowrap}
.step .d a{color:var(--accent-ink);text-decoration:none;font-weight:700}
.step .x{width:24px;height:24px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.step .x:hover{color:var(--danger);background:var(--surface)}
.addstep{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center}
.addstep input{border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:8px 10px;outline:0;font:inherit;color:inherit;min-width:0}
.addstep input:focus{border-color:var(--accent)}
.goalbox{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.goalbox .ring{border-bottom:0;padding:0}
.goalbox .ring svg{width:56px;height:56px}
.confirm{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}

/* ================= settings ================= */
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.smenu{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.smenu a{padding:9px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-decoration:none;display:flex;align-items:center;gap:8px}
.smenu a:hover{background:var(--surface-2);color:var(--ink)}
.smenu a.on{background:var(--ink);color:var(--bg)}
.spanel{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.sec .desc{color:var(--muted);font-size:13px;margin-top:-8px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;transition:border-color .15s,transform .15s}
.theme:hover{transform:translateY(-1px)}
.theme.on{border-color:var(--accent-ink)}
.theme .prev{height:58px;border-radius:9px;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.theme .prev i{position:absolute;left:8px;right:8px;height:9px;border-radius:5px}
.theme .prev i:nth-child(1){top:8px;width:40%}
.theme .prev i:nth-child(2){top:23px}
.theme .prev i:nth-child(3){top:38px;width:60%}
.theme .nm{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.optrow:first-of-type{border-top:0}
.optrow .k{font-weight:600;font-size:14px}
.optrow .k small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line-2);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.colors input[type=color]{width:52px;height:36px;border:1px solid var(--line-2);border-radius:8px;background:none;padding:2px;cursor:pointer}
.wlist{display:flex;flex-direction:column;gap:4px}
.wrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.wrow .t{flex:1;font-weight:600;font-size:14px}
.wrow.off .t{color:var(--muted);text-decoration:line-through}
.wrow button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.wrow button:hover{background:var(--surface)}
.folders-edit{display:flex;flex-direction:column;gap:6px}
.frow2{display:flex;gap:8px;align-items:center}
.frow2 input{border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:8px 10px;outline:0;font:inherit;color:inherit;min-width:0}
.frow2 input.em{width:56px;text-align:center}
.frow2 input.nm{flex:1}
.bgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bgopt{border:2px solid var(--line);border-radius:12px;height:64px;cursor:pointer;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--bg);position:relative;overflow:hidden}
.bgopt.on{border-color:var(--accent-ink)}
.bgopt.dots{background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:12px 12px}
.bgopt.lines{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 12px}
.bgopt.image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.bgopt input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ================= onboarding ================= */
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.onb .card2{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(0,0,0,.12)}
.onb h2{font-family:var(--font-brand);margin:0;font-size:26px;font-weight:700}
.onb .steps-dots{display:flex;gap:6px}
.onb .steps-dots i{width:22px;height:4px;border-radius:2px;background:var(--track)}
.onb .steps-dots i.on{background:var(--accent)}
.onb p{margin:0;color:var(--ink-2);line-height:1.5}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radios input{accent-color:var(--accent)}
.avpick{display:flex;align-items:center;gap:16px}
.avpick .btns{display:flex;gap:8px;flex-wrap:wrap}
.avpick input[type=file]{display:none}

/* ================= appearance variants ================= */
[data-cards="deco"] .card,[data-cards="deco"] .panel,[data-cards="deco"] .widget,[data-cards="deco"] .dcard,[data-cards="deco"] .review,[data-cards="deco"] .sec,[data-cards="deco"] .wish{border-color:transparent;box-shadow:0 1px 2px rgba(42,37,33,.04),0 12px 32px rgba(42,37,33,.08);border-radius:22px;background-image:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,var(--accent)) 0%,var(--surface) 38%)}
[data-cards="deco"] .wish{border-radius:22px}
[data-cards="deco"] .label{color:var(--accent-ink)}
[data-anim="off"] *,[data-anim="off"] *::before,[data-anim="off"] *::after{transition:none!important;animation:none!important}
[data-bg="dots"] body,body[data-bg="dots"]{background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:14px 14px}
body[data-bg="lines"]{background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 16px}
body[data-bg="image"]{background-image:var(--bgimg);background-size:cover;background-position:center;background-attachment:fixed}
body[data-bg="image"] .wrap{background:color-mix(in srgb,var(--bg) 78%,transparent);border-radius:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body[data-bg="image"]{padding-inline:8px}
body[data-fs="s"] .wrap{zoom:.92}
body[data-fs="l"] .wrap{zoom:1.1}
body[data-fs="xl"] .wrap{zoom:1.2}

/* ================= responsive additions ================= */
@media (max-width:1100px){.settings{grid-template-columns:1fr}.smenu{position:static;flex-direction:row;flex-wrap:wrap}.smenu a{padding:7px 11px}}
@media (max-width:900px){.detail{grid-template-columns:1fr}.wgrid{grid-template-columns:1fr}}
@media (max-width:720px){
  .nav{display:none}
  .top{flex-wrap:nowrap;gap:10px}
  .brand .sub{display:none}
  .brand h1{font-size:19px}
  .me .status{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--accent-ink);background:var(--accent-soft)}
  .tabbar svg{width:22px;height:22px}
  .wrap{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .fab{display:inline-flex;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .fab.desktop{display:none}
  .masonry{columns:2 150px;column-gap:10px}
  .wish{margin-bottom:10px;border-radius:14px}
  .wishhead h2{font-size:22px}
  .overlay{padding:0;align-items:flex-end}
  .sheet{border-radius:20px 20px 0 0;max-height:94vh;width:100%}
  .two{grid-template-columns:1fr}
  .addstep{grid-template-columns:1fr}
  .homehead .hi{font-size:20px}
  body[data-bg="image"] .wrap{border-radius:0}
  body[data-bg="image"]{padding-inline:0}
}
@media (min-width:721px){.fab.desktop{display:inline-flex;position:static;box-shadow:none;padding:9px 16px}}

/* ================= quiz, style page, notifications ================= */
.bell{position:relative}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.onb.quiz{background:color-mix(in srgb,var(--bg) 92%,var(--accent))}
.qcard{position:relative}
.qcard.fwd{animation:qin .28s ease}
.qcard.back{animation:qback .28s ease}
@keyframes qin{from{opacity:0;transform:translateX(24px)}}
@keyframes qback{from{opacity:0;transform:translateX(-24px)}}
.qprog{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.qblock{font-size:40px;line-height:1}
.qnum{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.qt{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.multi{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:14.5px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateX(2px)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opts.multi .opt{padding:8px 13px;border-radius:999px}
.hint2{font-size:12px;color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45}
.stylepage{display:flex;flex-direction:column;gap:16px}
.stylehero{flex-direction:row;align-items:flex-start;gap:20px}
.stylehero h2{margin:2px 0 6px;font-family:var(--font-brand);font-size:30px;font-weight:700}
.stylehero p{margin:0 0 8px;color:var(--ink-2);line-height:1.5}
.semoji{font-size:56px;line-height:1;flex:none}
ul.nice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;color:var(--ink-2)}
ul.nice li{display:flex;gap:9px;align-items:baseline}
ul.nice li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ans{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;line-height:1.45}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.nitem.unread{border-color:var(--accent);background:var(--accent-soft)}
.nitem .nt{font-size:14px}
.nitem .nm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.nitem .nm a{color:var(--accent-ink);font-weight:700;text-decoration:none}
.wstyle{display:flex;gap:14px;align-items:center}
.wstyle .semoji{font-size:40px}
@media (max-width:720px){.stylehero{flex-direction:column;gap:10px}.stylehero h2{font-size:24px}.qt{font-size:19px}}

.qtop{display:flex;flex-direction:column;gap:6px}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.qpct{color:var(--accent-ink)}
.qprog i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.opt{display:flex;align-items:center;gap:10px}
.opt .tick{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.opt.on .tick{background:var(--accent);border-color:var(--accent)}
.opt.on .tick::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}

/* ================= growth ================= */
.weektools2{flex-direction:column;gap:12px}
.growhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.growhead h2{font-family:var(--font-brand);font-size:26px;font-weight:700;margin:0}
.growhead .tag{color:var(--muted);font-size:13px;margin-top:4px}
#viewGrowth .sec{margin-bottom:16px}
.gsum p{margin:0;font-size:17px;line-height:1.5;max-width:70ch}
.gtiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.gtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;min-width:0}
.gtile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.gtile .k{font-size:12px;color:var(--muted);margin-top:5px}
.dl{display:block;font-size:11px;margin-top:6px;color:var(--muted)}
.dl.up{color:var(--accent-ink)}
.dl.down{color:var(--muted)}
.gchart svg{width:100%;height:auto}
.gchart text{font-size:9px}
.goalrows{display:flex;flex-direction:column;gap:10px}
.goalrows .goalrow{text-decoration:none;color:inherit}
.arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:6px 0}
.arow .an{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .av{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.arow .av small{font-weight:600;color:var(--muted)}
.arow .av small.up{color:var(--accent-ink)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.hcard{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hcard b{font-size:14px}
.hcard .hm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0;position:relative;margin-top:6px}
.tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--track)}
.tle{display:flex;gap:14px;align-items:flex-start;padding:8px 0;position:relative}
.tle.mine{cursor:pointer;border-radius:10px}
.tle.mine:hover{background:var(--surface-2)}
.tli{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none;position:relative;z-index:1;border:2px solid var(--surface)}
.tlb{padding-top:6px;min-width:0}
.tlt{font-weight:700;font-size:14px}
.tlx{color:var(--ink-2);font-size:13.5px}
.tld{color:var(--muted);font-size:12px;margin-top:2px}
.tld a{color:var(--accent-ink)}
@media (max-width:1100px){.gtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.gtiles{grid-template-columns:repeat(2,minmax(0,1fr))}.gtile .v{font-size:22px}.growhead h2{font-size:22px}.gsum p{font-size:15px}.arow{grid-template-columns:minmax(0,1fr) auto}.arow .bar{grid-column:1/-1}}

.auth .authlogo{display:flex;gap:14px;align-items:center}
.auth .authlogo img{border-radius:14px}
.auth h2{margin:0}
.auth p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.auth form{display:flex;flex-direction:column;gap:12px}
.authmsg{background:var(--accent-soft);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:13.5px}
.authmsg.ok{color:var(--accent-ink)}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const WDA=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const WDS=['пн','вт','ср','чт','пт','сб','вс'];
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return (h>=11&&h<=14)?c:(m===1?a:(m>=2&&m<=4?b:c));};
const tasksWord=n=>plural(n,'задача','задачи','задач');
const tasksGen=n=>(n%10===1&&n%100!==11)?'задачи':'задач';   // after «из N»
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const todayKey=dkey(new Date());
let weekStart=mondayOf(new Date());
let wk=dkey(weekStart);
const cache={};           // weekKey -> state
let state=null, prevState=null;

/* ---------------- state ---------------- */
function emptyWeek(k){
  const st=parse(k); const days={};
  for(let i=0;i<7;i++){days[dkey(addDays(st,i))]={tasks:[],note:'',energy:0};}
  return {v:1,days,goals:[],review:{good:'',bad:'',focus:''},updated:0};
}
function normalize(s,k){
  const e=emptyWeek(k); if(!s||typeof s!=='object')return e;
  const out={v:1,days:{},goals:Array.isArray(s.goals)?s.goals:[],review:Object.assign(e.review,s.review||{}),updated:s.updated||0};
  for(const dk of Object.keys(e.days)){const d=(s.days&&s.days[dk])||{};out.days[dk]={tasks:Array.isArray(d.tasks)?d.tasks:[],note:d.note||'',energy:+d.energy||0};}
  return out;
}
const EX_NOTE='Все приоритеты по работе закрыты до четверга';
function sampleWeek(k){
  const s=emptyWeek(k); const ks=Object.keys(s.days);
  const T=(t,done,pri)=>({id:uid(),t,done:!!done,pri:!!pri,ex:true});
  s.days[ks[0]].tasks=[T('Разобрать почту и задачи на неделю',1),T('Созвон с командой 11:00',1,1),T('Спортзал',1)]; s.days[ks[0]].energy=4;
  s.days[ks[1]].tasks=[T('Подготовить презентацию',1,1),T('Купить продукты',1),T('Почитать 30 минут',0)]; s.days[ks[1]].energy=3; s.days[ks[1]].note='После 18:00 уже не было сил на чтение';
  s.days[ks[2]].tasks=[T('Сдать отчёт',1,1),T('Записаться к врачу',1),T('Английский, урок 12',1)]; s.days[ks[2]].energy=5;
  s.days[ks[3]].tasks=[T('Встреча с Аней',1),T('Оплатить счета',0),T('Прогулка 40 минут',1)]; s.days[ks[3]].energy=4;
  s.days[ks[4]].tasks=[T('Закрыть задачи по проекту',0,1),T('Уборка',0),T('Пятничный ужин',1)]; s.days[ks[4]].energy=2; s.days[ks[4]].note='Проект уехал на понедельник';
  s.days[ks[5]].tasks=[T('Музей с друзьями',1),T('Позвонить родителям',1)]; s.days[ks[5]].energy=4;
  s.days[ks[6]].tasks=[T('Спланировать следующую неделю',0,1),T('День без телефона',0)];
  s.goals=[{id:uid(),t:'Закрыть проект до пятницы',done:false,ex:true},{id:uid(),t:'3 тренировки',done:true,ex:true},{id:uid(),t:'Читать каждый день',done:false,ex:true}];
  s.review.good=EX_NOTE;
  return s;
}
function hasExamples(s){return (!!s&&(s.goals.some(g=>g.ex)||Object.values(s.days).some(d=>d.tasks.some(t=>t.ex))))||(typeof wishes!=='undefined'&&wishes.some(w=>w.ex));}
function stripExamples(s){s.goals=s.goals.filter(g=>!g.ex);for(const d of Object.values(s.days)){d.tasks=d.tasks.filter(t=>!t.ex);if(d.note==='После 18:00 уже не было сил на чтение'||d.note==='Проект уехал на понедельник')d.note='';d.energy=0;}if(s.review.good===EX_NOTE)s.review.good='';}

async function getWeek(k){
  if(cache[k])return cache[k];
  let data=await store.load(k);
  let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
  if(!data&&k===dkey(mondayOf(new Date()))&&!seen){data=sampleWeek(k);}
  cache[k]=normalize(data,k); return cache[k];
}

/* ---------------- metrics ---------------- */
function dayStats(d){const n=d.tasks.length,done=d.tasks.filter(t=>t.done).length;return {n,done,pct:n?Math.round(done/n*100):0};}
function weekStats(s){
  let n=0,done=0,pn=0,pdone=0,esum=0,ecnt=0; const per=[];
  for(const [k,d] of Object.entries(s.days)){const st=dayStats(d);per.push(Object.assign({k},st));n+=st.n;done+=st.done;
    for(const t of d.tasks){if(t.pri){pn++;if(t.done)pdone++;}}
    if(d.energy){esum+=d.energy;ecnt++;}}
  const gn=s.goals.length,gdone=s.goals.filter(g=>g.done).length;
  return {n,done,pct:n?Math.round(done/n*100):0,pn,pdone,gn,gdone,per,energy:ecnt?esum/ecnt:0,full:per.filter(p=>p.n&&p.pct===100).length};
}

/* ---------------- render ---------------- */
function rangeLabel(st){
  const en=addDays(st,6);
  const a=st.getMonth()===en.getMonth()?st.getDate()+' – '+en.getDate()+' '+MONTHS[en.getMonth()]:st.getDate()+' '+MONTHS[st.getMonth()]+' – '+en.getDate()+' '+MONTHS[en.getMonth()];
  const diff=Math.round((st-mondayOf(new Date()))/864e5/7);
  const tag=diff===0?'Текущая неделя':diff===-1?'Прошлая неделя':diff===1?'Следующая неделя':diff<0?Math.abs(diff)+' '+plural(Math.abs(diff),'неделю','недели','недель')+' назад':'через '+diff+' '+plural(diff,'неделю','недели','недель');
  return '<small>'+tag+'</small>'+a+' '+en.getFullYear();
}
function renderAll(){
  $('#range').innerHTML=rangeLabel(weekStart);
  $('#banner').hidden=!hasExamples(state);
  renderCards(); renderPanel(); renderGoals(); renderReview(true);
  $('#review').hidden=!S().cal.review;
}
function afterChange(){$('#banner').hidden=!hasExamples(state);renderPanel();renderReview(false);renderCards();updateDaySummary();if(view.type==='home')renderHome();}

/* ---- week overview: one card per day ---- */
function renderCards(){
  const host=$('#days'); host.innerHTML='';
  Object.keys(state.days).forEach((k,i)=>host.appendChild(cardEl(k,i)));
}
function cardEl(k,i){
  const d=state.days[k],st=dayStats(d),date=parse(k);
  const pn=d.tasks.filter(t=>t.pri).length,pd=d.tasks.filter(t=>t.pri&&t.done).length;
  const a=document.createElement('a');
  a.className='card'+(k===todayKey?' today':'')+(k<todayKey&&S().cal.dimPast?' past':'');
  a.href='#day-'+k; a.dataset.card=k;
  a.setAttribute('aria-label',WD[i]+', '+date.getDate()+' '+MONTHS[date.getMonth()]+': '+(st.n?st.done+' из '+st.n+' '+tasksGen(st.n)+', '+st.pct+'%':'нет задач'));
  a.innerHTML=
    '<div class="dhead"><span class="wd">'+WD[i]+'</span><span class="dt">'+date.getDate()+'</span></div>'+
    '<div class="ring">'+ringSvg(st)+'<div><div class="num">'+st.pct+'%</div><div class="cap">'+(st.n?st.n+' '+tasksWord(st.n):'нет задач')+'</div></div></div>'+
    '<div class="bar"><i class="'+(st.pct===100&&st.n?'full':'')+'" style="width:'+st.pct+'%"></i></div>'+
    '<div class="cmeta"><span>'+(st.n?'выполнено '+st.done+' из '+st.n:'добавить задачи')+'</span><span>'+(pn?'★ '+pd+'/'+pn:'')+'</span></div>'+
    '<div class="open">Открыть день</div>';
  a.addEventListener('click',e=>{e.preventDefault();showDay(k);});
  return a;
}

/* ---- day page ---- */
function col(k){const v=$('#viewDay');return v.dataset.k===k?v:null;}
function ringSvg(st){
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="tr" cx="20" cy="20" r="15.9155"/><circle class="pr'+(st.pct===100&&st.n?' full':'')+'" cx="20" cy="20" r="15.9155" stroke-dasharray="'+st.pct+' 100"/></svg>';
}
function ringHtml(d){
  const st=dayStats(d);
  return ringSvg(st)+'<div><div class="num">'+st.pct+'%</div><div class="cap">'+(st.n?st.done+' из '+st.n+' '+tasksGen(st.n)+' выполнено':'нет задач')+'</div></div>';
}
function updateRing(k){const c=col(k);if(c)c.querySelector('.ring').innerHTML=ringHtml(state.days[k]);afterChange();}
function updateDaySummary(){
  const v=$('#viewDay'); if(!v.dataset.k)return;
  const d=state.days[v.dataset.k]; if(!d)return;
  const pn=d.tasks.filter(t=>t.pri).length,pd=d.tasks.filter(t=>t.pri&&t.done).length;
  const cap=(typeof quizAnswers==='function'&&typeof quizAnswers().perday==='number')?[2,4,6,99][quizAnswers().perday]:null;

    }

  }
  $('#verdict').textContent=verdict;

  } else tr.innerHTML='<span class="hint">'+(w.n?'Невыполненных задач нет — переносить нечего.':'')+'</span>';

/* ---------------- storage: account store when available, else this browser ----------------
   Every record is a document in the viewer's private subtree data/users/<id>/:
   w-<monday> (week), profile, bg (background image), wish-<id> (one per wish).
   Without the account store: weeks + profile in localStorage, wishes + background in IndexedDB. */
const idb={p:null,
  open(){ if(this.p)return this.p; this.p=new Promise(res=>{ try{ const r=indexedDB.open('planner',1); r.onupgradeneeded=()=>r.result.createObjectStore('docs'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){res(null);} }); return this.p; },
  async get(k){ const d=await this.open(); if(!d)return null; return new Promise(res=>{ try{ const t=d.transaction('docs').objectStore('docs').get(k); t.onsuccess=()=>res(t.result||null); t.onerror=()=>res(null);}catch(e){res(null);} }); },
  async set(k,v){ const d=await this.open(); if(!d)throw new Error('no idb'); return new Promise((res,rej)=>{ const tx=d.transaction('docs','readwrite'); tx.objectStore('docs').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  async del(k){ const d=await this.open(); if(!d)return; return new Promise(res=>{ const tx=d.transaction('docs','readwrite'); tx.objectStore('docs').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); },
  async all(){ const d=await this.open(); if(!d)return {}; return new Promise(res=>{ try{ const st=d.transaction('docs').objectStore('docs'); const ks=st.getAllKeys(), vs=st.getAll(); vs.onsuccess=()=>{ const out={}; (ks.result||[]).forEach((k,i)=>out[k]=vs.result[i]); res(out); }; vs.onerror=()=>res({}); }catch(e){res({});} }); }
};
const isLS=id=>id.startsWith('w-')||id==='profile';
const store={mode:'local',db:null,uid:null,
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
        if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode='db';}}
      }
    }catch(e){}
  },
  col(){return this.db.collection('data/users/'+this.uid);},
  async localGet(id){ if(isLS(id)){try{const r=localStorage.getItem('planner.'+id);return r?JSON.parse(r):null;}catch(e){return null;}} return idb.get(id); },
  async localSet(id,body){ if(isLS(id)){localStorage.setItem('planner.'+id,JSON.stringify(body));} else await idb.set(id,body); },
  async localDel(id){ try{ if(isLS(id))localStorage.removeItem('planner.'+id); else await idb.del(id);}catch(e){} },
  async loadDoc(id){
    if(this.mode==='db'){
      try{const s=await this.col().doc(id).get();if(s.exists)return clone(s.data());}catch(e){}
      const l=await this.localGet(id); if(l){this.writeDoc(id,l).catch(()=>{});} return l;   // carry over what this browser already had
    }
    return this.localGet(id);
  },
  async writeDoc(id,data){
    const body=clone(data);
    if(this.mode==='db'){
      try{await this.col().doc(id).set(body);}
      catch(e){ if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*400));await this.col().doc(id).set(body);} else { this.mode='local'; idleStatus(); } }
    }
    try{await this.localSet(id,body);}catch(e){ if(this.mode!=='db') throw e; }
  },
  async deleteDoc(id){ if(this.mode==='db'){try{await this.col().doc(id).delete();}catch(e){}} await this.localDel(id); },
  async listWishes(){
    let local=[]; try{const all=await idb.all();local=Object.entries(all).filter(([k])=>k.startsWith('wish-')).map(([,v])=>v);}catch(e){}
    if(this.mode==='db'){
      try{const q=await this.col().where('type','==','wish').get();const arr=q.docs.map(d=>clone(d.data()));if(arr.length)return arr;}catch(e){}
      for(const w of local){this.writeDoc('wish-'+w.id,w).catch(()=>{});}
    }
    return local;
  },
  load(k){return this.loadDoc('w-'+k);},
  write(k,data){return this.writeDoc('w-'+k,data);}
};
const timers={},inflight={},queued={},pendingDocs={};
function setStatus(kind,text){$('#status').className='status '+(kind||'');$('#statusText').textContent=text;}
function idleStatus(){setStatus('',store.mode==='db'?'Хранится в аккаунте':'Хранится в этом браузере');}
function markSeen(){try{localStorage.setItem('planner.seen','1');}catch(e){} persistSampleWishes();}
function persistSampleWishes(){ if(typeof wishes==='undefined')return; for(const w of wishes){ if(w.ex&&!w._p){ w._p=true; const c=clone(w); delete c._p; pendingDocs['wish-'+w.id]=c; clearTimeout(timers['wish-'+w.id]); timers['wish-'+w.id]=setTimeout(()=>flush('wish-'+w.id),600); } } }
function save(k){ k=k||wk; queueDoc('w-'+k,cache[k]); }
function queueDoc(id,obj){
  if(!obj)return; markSeen(); pendingDocs[id]=obj;
  clearTimeout(timers[id]); setStatus('saving','Сохраняю…');
  timers[id]=setTimeout(()=>flush(id),500);
}
async function flush(id){
  const data=pendingDocs[id]; if(!data)return;
  if(inflight[id]){queued[id]=true;return;}
  inflight[id]=(async()=>{try{data.updated=Date.now();await store.writeDoc(id,data);setStatus('','Сохранено');}catch(e){setStatus('error','Не удалось сохранить');}})();
  await inflight[id]; inflight[id]=null;
  if(queued[id]){queued[id]=false;flush(id);}
}

const hex2=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];};
const rgb2=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
function mix(a,b,t){const x=hex2(a),y=hex2(b);return rgb2(x.map((v,i)=>v+(y[i]-v)*t));}

/* ---------------- images ---------------- */
function compressImage(file,maxSide,q){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('Это не изображение'));
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',q); let qq=q; while(out.length>220000&&qq>.4){qq-=.1;out=c.toDataURL('image/jpeg',qq);} res(out);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось прочитать картинку'));};
    img.src=url;
  });
}

const TONE_NAMES={energetic:'Энергичный',soft:'Мягкий',practical:'Практичный',important:'Минимальный',brief:'Короткий'};
function quizAnswers(){return (P.quiz&&P.quiz.answers)||{};}
function quizQ(id){return QUIZ.find(q=>q.id===id)||null;}
function sel(id){const a=quizAnswers()[id];return Array.isArray(a)?a:[];}
function answerText(id){const q=quizQ(id);return sel(id).map(i=>q.o[i]).join(', ');}
function answeredCount(){return QUIZ.filter(q=>sel(q.id).length).length;}
function computeStyle(){
  const sc={st:0,c:0,e:0,p:0,b:0}; let any=false;
  for(const q of QUIZ){if(!q.w)continue;for(const i of sel(q.id)){any=true;const w=q.w[i]||{};for(const k in w)sc[k]+=w[k];}}
  if(!any)return null;
  return Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];
}
function quizTone(){const q=quizQ('tone');const s=sel('tone');return s.length?q.tone[s[0]]:null;}
function currentStyle(){return P.styleOverride||(P.quiz&&P.quiz.style)||null;}
function finishQuiz(){
  P.quiz=P.quiz||{answers:{}}; P.quiz.v=2; P.quiz.done=true; P.quiz.inProgress=false; P.quiz.date=Date.now(); P.quiz.style=computeStyle()||'b';
  const t=quizTone(); if(t){S().notif=S().notif||{};S().notif.tone=t;}
  saveProfile();
}
/* one question per screen; animated 0–100% bar; «N из 8»; answers saved on every move and survive reloads */
function runQuiz(){
  const host=$('#onbHost'); const total=QUIZ.length;
  if(!P.quiz||P.quiz.v!==2){P.quiz={v:2,answers:{},done:false};}
  P.quiz.answers=P.quiz.answers||{}; P.quiz.inProgress=true;
  let i=(!P.quiz.done&&typeof P.quiz.pos==='number'&&P.quiz.pos>0&&P.quiz.pos<total)?P.quiz.pos:0;
  const fmtPct=n=>String(n*12.5).replace('.',',')+'%';
  function render(dir){
    const q=QUIZ[i]; const A=P.quiz.answers; const cur=sel(q.id); const n=answeredCount(); const pct=n*12.5; P.quiz.pos=i;
    host.innerHTML='<div class="onb quiz"><div class="card2 qcard '+(dir||'')+'">'+
      '<div class="qtop"><div class="qprog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><div class="qmeta"><span>'+n+' из '+total+' отвечено</span><span class="qpct">'+fmtPct(n)+'</span></div></div>'+
      '<div class="qnum">Вопрос '+(i+1)+(q.optional?' · необязательный':'')+'</div><h2 class="qt">'+phrase(q.t)+'</h2>'+(q.note?'<p class="fine" style="margin:-6px 0 0">'+q.note+'</p>':'')+
      '<div class="opts">'+q.o.map((o,k)=>'<button type="button" class="opt'+(cur.includes(k)?' on':'')+'" data-k="'+k+'" aria-pressed="'+cur.includes(k)+'"><span class="tick"></span>'+o+'</button>').join('')+'</div>'+
      '<span class="hint2">'+(q.exclusive!=null?'Можно выбрать несколько — кроме «Предпочитаю не отвечать», он только отдельно':'Можно выбрать один или несколько вариантов')+'</span>'+
      '<div class="sfoot" style="padding:0"><button class="pill" id="qBack">'+(i===0?'Выйти':'Назад')+'</button><span class="grow"></span><button class="pill" id="qSkip">Пропустить</button><button class="pill primary" id="qNext">'+(i===total-1?'Показать профиль':'Далее')+'</button></div></div></div>';
    const bar=host.querySelector('.qprog i'); requestAnimationFrame(()=>{bar.style.width=(answeredCount()*12.5)+'%';});
    host.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k; let s=sel(q.id).slice();
      if(q.exclusive!=null&&k===q.exclusive){s=s.includes(k)?[]:[k];}
      else{ if(q.exclusive!=null)s=s.filter(x=>x!==q.exclusive); const j=s.indexOf(k); if(j>-1)s.splice(j,1); else s.push(k); }
      A[q.id]=s; queueDoc('profile',P);
      host.querySelectorAll('.opt').forEach(x=>{const on=s.includes(+x.dataset.k);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
      const nn=answeredCount(); host.querySelector('.qprog i').style.width=(nn*12.5)+'%'; host.querySelector('.qmeta span').textContent=nn+' из '+total+' отвечено'; host.querySelector('.qpct').textContent=fmtPct(nn);
    }));
    const go=d=>{queueDoc('profile',P);if(i+d<0){exit();return;}if(i+d>=total){done();return;}i+=d;render(d>0?'fwd':'back');};
    $('#qNext').addEventListener('click',()=>go(1));
    $('#qSkip').addEventListener('click',()=>{A[q.id]=[];go(1);});
    $('#qBack').addEventListener('click',()=>go(-1));
    host.querySelector('.onb').addEventListener('keydown',e=>{if(e.key==='Escape')exit();if(e.key==='Enter')go(1);});
    host.querySelector('.qcard').setAttribute('tabindex','-1'); host.querySelector('.qcard').focus({preventScroll:true});
  }
  function exit(){queueDoc('profile',P);host.innerHTML='';renderHome();}
  function done(){finishQuiz();host.innerHTML='';showStyle();toast(phrase('{n}, готово ✨ Вот твой профиль предпочтений.'));}
  render('fwd');
}

function NF(){const s=S();s.notif=Object.assign(clone(DEF_NOTIF),s.notif||{});s.notif.quiet=Object.assign({from:'22:00',to:'07:00'},s.notif.quiet||{});return s.notif;}

const hm=s=>{const [h,m]=(s||'0:0').split(':').map(Number);return h*60+(m||0);};
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}

function deliver(key,text,link,opts){
  const st=notifState(); if(st.keys.includes(key))return false;
  st.keys.push(key); const item={id:uid(),ts:Date.now(),text,link:link||'',read:false};
  st.log.unshift(item); if(st.log.length>40)st.log.length=40;

function minutesSince(t){return nowMin()-hm(t);}
async function notifTick(force){
  const nf=NF(); if(!nf.on||!P.onboarded)return;
  const st=notifState(); const quiet=inQuiet(); const tone=toneKey(); const cap=capFor();
  const cw=cache[curWeekKey()]||await getWeek(curWeekKey()); const td=cw.days[todayKey]||{tasks:[]};
  const optionalCount=()=>st.keys.filter(k=>!k.startsWith('task-')&&!k.startsWith('step-')).length;
  const recent=t=>{const m=minutesSince(t);return m>=0&&m<=12;};
  const tryOpt=(key,text,link,fresh)=>{if(st.keys.includes(key))return;if(quiet)return;if(optionalCount()>=cap)return;deliver(key,text,link,{silent:!fresh});};
  // morning / day / evening
  if(tone){
    if(minutesSince(nf.morning)>=0)tryOpt('morning',phrase(pick(NT.morning[tone],'nm')),'#day-'+todayKey,recent(nf.morning)||force);
    if(nf.dayOn&&minutesSince(nf.day)>=0&&td.tasks.some(t=>!t.done))tryOpt('day',phrase(pick(NT.day[tone],'nd')),'#day-'+todayKey,recent(nf.day)||force);
    if(minutesSince(nf.evening)>=0&&td.tasks.length)tryOpt('evening',phrase(pick(NT.evening[tone],'ne')),'#week-'+curWeekKey(),recent(nf.evening)||force);
    if(nf.motiv&&minutesSince('15:00')>=0)tryOpt('motiv',phrase(pick(motivPool(),'m50')),'',recent('15:00')||force);
    if(nf.wishes&&wishes.length&&Date.now()-(st.lastWishVisit||0)>7*864e5)tryOpt('wish',phrase(pick(NT.wish,'nw')),'#wishes',force);
  }
  // tasks with a time in the text, 10 minutes before, only while not done
  if(nf.taskTimes&&!quiet){for(const t of td.tasks){if(t.done)continue;const tm=timeInText(t.t);if(tm==null)continue;const diff=tm-nowMin();if(diff<=10&&diff>-45){deliver('task-'+t.id,phrase(pick(NT.task,'nt')).replace('{t}',String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0')).replace('{task}',t.t),'#day-'+todayKey);}}}
  // goals: steps due today / in a few days
  if(nf.goals&&!quiet){
    const fromMorning=minutesSince(nf.morning)>=0;
    for(const w of wishes){ if(!w.isGoal||w.done)continue;
      for(const s of w.steps){ if(s.done||!s.date)continue;
        const d=Math.round((parse(s.date)-parse(todayKey))/864e5);
        if(d===0&&fromMorning)deliver('step-'+s.id,phrase(NT.goal[1]).replace('{g}',w.title).replace('{s}',s.t),'#day-'+s.date,{silent:!force&&!recent(nf.morning)});
        else if((d===1||d===3||d===7)&&fromMorning)tryOpt('goalsoon-'+s.id,phrase(NT.goal[2]).replace('{g}',w.title).replace('{s}',s.t).replace('{d}',d).replace('{дн}',pluralDays(d)),'#wish-'+w.id,false);
      }
      if(!w.steps.length&&fromMorning&&(Date.now()-(w.updated||w.created||0))>5*864e5)tryOpt('goalidle-'+w.id,phrase(NT.goal[0]).replace('{g}',w.title),'#wish-'+w.id,false);
    }
  }
}

/* steps <-> calendar tasks */
async function weekFor(k){return getWeek(dkey(mondayOf(parse(k))));}
function refreshIfVisible(k){const wkk=dkey(mondayOf(parse(k)));if(wkk===wk){if(view.type==='day'&&view.k===k)renderDayPage(k);afterChange();}renderHome();}
async function stepAddTask(w,st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;if(!d.tasks.some(t=>t.id===st.id))d.tasks.push({id:st.id,t:st.t,done:st.done,pri:true,wish:w.id});save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}
async function stepSetDone(w,st,done){st.done=done;st.doneAt=done?Date.now():0;saveWish(w);if(done)goalProgressNotify(w);if(st.date){const wobj=await weekFor(st.date);const d=wobj.days[st.date];const t=d&&d.tasks.find(x=>x.id===st.id);if(t){t.done=done;save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}renderWishes();renderHome();}
async function unlinkStepTask(st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;const i=d.tasks.findIndex(x=>x.id===st.id);if(i>-1){d.tasks.splice(i,1);save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}
async function stepRemove(w,st){w.steps=w.steps.filter(x=>x!==st);saveWish(w);if(st.date)await unlinkStepTask(st);renderWishes();renderHome();}
function taskWishSync(t,ch){const w=wishes.find(x=>x.id===t.wish);if(!w)return;const st=w.steps.find(s=>s.id===t.id);if(!st)return;if(ch.removed){w.steps=w.steps.filter(s=>s!==st);}else{if(ch.done!=null){st.done=ch.done;st.doneAt=ch.done?Date.now():0;}if(ch.text!=null)st.t=ch.text;if(ch.date!=null)st.date=ch.date;}saveWish(w);if(ch.done)goalProgressNotify(w);renderHome();}

/* ================= standalone app: accounts (Supabase), offline mirror, anonymous usage stats, admin page ================= */
const CFG=window.PLANER_CONFIG||{};
const SB_ON=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let sb=null, sbUser=null;
const guestKeys=()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('planner.')&&!k.startsWith('planner.u.'));}catch(e){return [];}};
/* local mirror keyed by account, so several people on one device never see each other's data */
const mirror={
  key(id){return 'planner.u.'+(sbUser?sbUser.id.slice(0,8):'guest')+'.'+id;},
  async get(id){ if(isLS(id)){try{const r=localStorage.getItem(this.key(id));return r?JSON.parse(r):null;}catch(e){return null;}} return idb.get(this.key(id)); },
  async set(id,body){ if(isLS(id)){localStorage.setItem(this.key(id),JSON.stringify(body));} else await idb.set(this.key(id),body); },
  async del(id){ try{ if(isLS(id))localStorage.removeItem(this.key(id)); else await idb.del(this.key(id)); }catch(e){} },
  async wishes(){ const all=await idb.all(); const pre=this.key('wish-'); return Object.entries(all).filter(([k])=>k.startsWith(pre)).map(([,v])=>v); },
};
const outbox={
  async add(id,body){ try{const o=(await idb.get('outbox'))||{}; o[id]=body===null?null:body; await idb.set('outbox',o);}catch(e){} },
  async flush(){ if(!sb||!sbUser||!navigator.onLine)return; let o={}; try{o=(await idb.get('outbox'))||{};}catch(e){return;} const ids=Object.keys(o); if(!ids.length)return;
    for(const id of ids){ try{ if(o[id]===null){await sb.from('docs').delete().eq('id',id);} else {await sb.from('docs').upsert({user_id:sbUser.id,id,data:o[id],updated_at:new Date().toISOString()});} delete o[id]; }catch(e){ break; } }
    try{await idb.set('outbox',o);}catch(e){} if(!Object.keys(o).length)setStatus('','Синхронизировано'); }
};
const cloud={
  async loadDoc(id){
    if(navigator.onLine){ try{ const {data,error}=await sb.from('docs').select('data').eq('id',id).maybeSingle(); if(!error){ if(data){await mirror.set(id,data.data);return clone(data.data);} return null; } }catch(e){} }
    return mirror.get(id);
  },
  async writeDoc(id,data){
    const body=clone(data); await mirror.set(id,body);
    try{ if(!navigator.onLine)throw new Error('offline'); const {error}=await sb.from('docs').upsert({user_id:sbUser.id,id,data:body,updated_at:new Date().toISOString()}); if(error)throw error; }
    catch(e){ await outbox.add(id,body); setStatus('','Сохранено офлайн — отправлю, когда появится сеть'); throw Object.assign(new Error('queued'),{queued:true}); }
  },
  async deleteDoc(id){ await mirror.del(id); try{ if(!navigator.onLine)throw new Error('offline'); await sb.from('docs').delete().eq('id',id); }catch(e){ await outbox.add(id,null); } },
  async listWishes(){
    if(navigator.onLine){ try{ const {data,error}=await sb.from('docs').select('data').like('id','wish-%'); if(!error&&data){ const arr=data.map(r=>r.data); for(const w of arr)await mirror.set('wish-'+w.id,w); return arr; } }catch(e){} }
    return mirror.wishes();
  },
};
/* hook the cloud layer into the existing store (keeps the Claude-artifact mode untouched) */
const _storeInit=store.init.bind(store);
store.init=async function(){
  if(!SB_ON){ return _storeInit(); }
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession(); sbUser=data&&data.session?data.session.user:null;
  if(sbUser){ this.mode='supabase'; this.uid=sbUser.id; }
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session?session.user:null; if((u&&u.id)!==(sbUser&&sbUser.id)){ sbUser=u; if(u){ location.reload(); } else { location.reload(); } } if(ev==='PASSWORD_RECOVERY')showPasswordReset(); });
};
const _loadDoc=store.loadDoc.bind(store), _writeDoc=store.writeDoc.bind(store), _deleteDoc=store.deleteDoc.bind(store), _listWishes=store.listWishes.bind(store);
store.loadDoc=function(id){return this.mode==='supabase'?cloud.loadDoc(id):_loadDoc(id);};
store.writeDoc=async function(id,data){ if(this.mode!=='supabase')return _writeDoc(id,data); try{await cloud.writeDoc(id,data);}catch(e){ if(!e.queued)throw e; setTimeout(()=>setStatus('','Сохранено офлайн — отправлю, когда появится сеть'),0); } };
store.deleteDoc=function(id){return this.mode==='supabase'?cloud.deleteDoc(id):_deleteDoc(id);};
store.listWishes=function(){return this.mode==='supabase'?cloud.listWishes():_listWishes();};
const _idle=idleStatus; idleStatus=function(){ if(store.mode==='supabase')setStatus('',navigator.onLine?'Синхронизируется с аккаунтом':'Офлайн — изменения сохранятся'); else _idle(); };
window.addEventListener('online',()=>{outbox.flush();idleStatus();}); window.addEventListener('offline',idleStatus);

/* ---- first login: carry guest data (from before registration) into the account, once ---- */
async function migrateGuest(){
  if(store.mode!=='supabase')return;
  const flag='planner.u.'+sbUser.id.slice(0,8)+'.migrated'; try{if(localStorage.getItem(flag))return;}catch(e){}
  const hasCloudProfile=!!(await cloud.loadDoc('profile'));
  if(!hasCloudProfile){
    for(const k of guestKeys()){ const id=k.slice('planner.'.length); if(id==='seen')continue; try{ const body=JSON.parse(localStorage.getItem(k)); if(body&&typeof body==='object')await cloud.writeDoc(id,body).catch(()=>{}); }catch(e){} }
    try{ const all=await idb.all(); for(const [k,v] of Object.entries(all)){ if((k.startsWith('wish-')||k==='bg')&&v&&typeof v==='object')await cloud.writeDoc(k,v).catch(()=>{}); } }catch(e){}
  }
  try{localStorage.setItem(flag,'1');}catch(e){}
}
