function cardEl(k,i){
  const d=state.days[k],st=dayStats(d),date=parse(k);
  const pn=d.tasks.filter(t=>t.pri).length,pd=d.tasks.filter(t=>t.pri&&t.done).length;
  const a=document.createElement('a');
  a.className='card'+(k===todayKey?' today':'')+(k<todayKey&&S().cal.dimPast?' past':'');
  a.href='#day-'+k; a.dataset.card=k;
  a.setAttribute('aria-label',WD[i]+', '+date.getDate()+' '+MONTHS[date.getMonth()]+': '+(st.n?st.done+' '+T_("из")+' '+st.n+' '+tasksGen(st.n)+', '+st.pct+'%':T_("нет задач")));
  a.innerHTML=
    '<div class="dhead"><span class="wd">'+WD[i]+'</span><span class="dt">'+date.getDate()+'</span></div>'+
    '<div class="ring">'+ringSvg(st)+'<div><div class="num">'+st.pct+'%</div><div class="cap">'+(st.n?st.n+' '+tasksWord(st.n):T_("нет задач"))+'</div></div></div>'+
    '<div class="bar"><i class="'+(st.pct===100&&st.n?'full':'')+'" style="width:'+st.pct+'%"></i></div>'+
    '<div class="cmeta"><span>'+(st.n?T_("выполнено")+' '+st.done+' '+T_("из")+' '+st.n:T_("добавить задачи"))+'</span><span>'+(pn?'★ '+pd+'/'+pn:'')+'</span></div>'+
    '<div class="open">'+T_("Открыть день")+'</div>';
  a.addEventListener('click',e=>{e.preventDefault();showDay(k);});
  return a;
}

/* ---- day page ---- */
function col(k){const v=$('#viewDay');return v.dataset.k===k?v:null;}
function ringSvg(st){
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="tr" cx="20" cy="20" r="15.9155"/><circle class="pr'+(st.pct===100&&st.n?' full':'')+'" cx="20" cy="20" r="15.9155" stroke-dasharray="'+st.pct+' 100"/></svg>';
}
function ringHtml(d){
  const st=dayStats(d);
  return ringSvg(st)+'<div><div class="num">'+st.pct+'%</div><div class="cap">'+(st.n?st.done+' '+T_("из")+' '+st.n+' '+tasksGen(st.n)+' '+T_("выполнено"):T_("нет задач"))+'</div></div>';
}
function updateRing(k){const c=col(k);if(c)c.querySelector('.ring').innerHTML=ringHtml(state.days[k]);afterChange();}
function updateDaySummary(){
  const v=$('#viewDay'); if(!v.dataset.k)return;
  const d=state.days[v.dataset.k]; if(!d)return;
  const pn=d.tasks.filter(t=>t.pri).length,pd=d.tasks.filter(t=>t.pri&&t.done).length;
  const cap=(typeof quizAnswers==='function'&&typeof quizAnswers().perday==='number')?[2,4,6,99][quizAnswers().perday]:null;
  const el=v.querySelector('.dsum'); if(el)el.innerHTML='<span class="pill" style="cursor:default">'+d.tasks.length+' '+tasksWord(d.tasks.length)+'</span>'+(pn?'<span class="pill" style="cursor:default">★ '+T_("приоритеты")+' '+pd+' '+T_("из")+' '+pn+'</span>':'')+(cap&&d.tasks.length>cap?'<span class="pill" style="cursor:default;color:var(--accent-ink)" title="'+T_("По анкете тебе комфортно до")+' '+cap+' '+T_("задач в день")+'">'+T_("больше, чем обычно комфортно")+'</span>':'');
  const empty=v.querySelector('.empty'); if(empty)empty.hidden=d.tasks.length>0;
}
function renderDayPage(k){
  const v=$('#viewDay'); const keys=Object.keys(state.days); const i=keys.indexOf(k);
  const d=state.days[k],date=parse(k);
  const pk=dkey(addDays(date,-1)),nk=dkey(addDays(date,1));
  const pd=parse(pk),nd=parse(nk);
  v.dataset.k=k;
  v.innerHTML=
    '<nav class="daynav" aria-label="'+T_("Навигация по дням")+'">'+
      '<div class="pair">'+
        '<button class="pill nav" id="prevDay" aria-label="'+T_("Предыдущий день:")+' '+WD[(pd.getDay()+6)%7]+', '+pd.getDate()+' '+MONTHS[pd.getMonth()]+'">‹ <span class="long">'+T_("Предыдущий день")+'</span><span class="short">'+WDS[(pd.getDay()+6)%7]+' '+pd.getDate()+'</span></button>'+
        '<button class="pill" id="todayDay">'+T_("Сегодня")+'</button>'+
        '<button class="pill nav" id="nextDay" aria-label="'+T_("Следующий день:")+' '+WD[(nd.getDay()+6)%7]+', '+nd.getDate()+' '+MONTHS[nd.getMonth()]+'"><span class="long">'+T_("Следующий день")+'</span><span class="short">'+WDS[(nd.getDay()+6)%7]+' '+nd.getDate()+'</span> ›</button>'+
      '</div>'+
    '</nav>'+
    '<header class="dayhead">'+
      '<div><h2>'+WD[i]+'</h2><div class="when">'+date.getDate()+' '+MONTHS[date.getMonth()]+' '+date.getFullYear()+(k===todayKey?' <span class="chip">'+T_("сегодня")+'</span>':'')+'</div></div>'+
      '<div class="dsum"></div>'+
    '</header>'+
    '<div class="daygrid">'+
      '<section class="dcard" aria-label="'+T_("Задачи дня")+'">'+
        '<div class="label">'+T_("Задачи")+'</div>'+
        '<div class="tasks"></div>'+
        '<div class="empty" hidden>'+T_("Пока пусто — добавь первую задачу.")+'</div>'+
        '<div class="add"><span class="plus">+</span><input placeholder="'+T_("Новая задача")+'" aria-label="'+T_("Новая задача на")+' '+WDA[i]+'"></div>'+
      '</section>'+
      '<aside class="side">'+
        '<div class="dcard"><div class="label">'+T_("Выполнение дня")+'</div><div class="ring">'+ringHtml(d)+'</div></div>'+
        (S().cal.note?'<div class="dcard"><div class="label">'+T_("Заметка дня")+'</div><textarea class="note" rows="1" placeholder="'+T_("Что важно помнить про этот день")+'" aria-label="'+T_("Заметка дня")+'">'+esc(d.note)+'</textarea></div>':'')+
        (S().cal.energy?'<div class="dcard"><div class="label">'+T_("Энергия дня")+'</div><div class="energy"><div class="dots" role="group" aria-label="'+T_("Энергия дня")+'"></div><span class="hint" style="font-size:12px;color:var(--muted)">1 — '+T_("совсем нет сил, 5 —")+' '+(P.gender==='m'?T_("полон"):T_("полна"))+' '+T_("энергии")+'</span></div></div>':'')+
      '</aside>'+
    '</div>';
  const list=v.querySelector('.tasks');
  d.tasks.forEach(t=>list.appendChild(taskEl(k,t)));
  fitAll(list);
  const add=v.querySelector('.add input');
  const commit=()=>{const val=add.value.trim();if(!val)return;add.value='';addTask(k,val);};
  add.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}});
  add.addEventListener('blur',commit);
  const note=v.querySelector('.note');
  if(note){note.addEventListener('input',()=>{d.note=note.value;autosize(note);save();});requestAnimationFrame(()=>autosize(note));}
  const dots=v.querySelector('.dots');
  if(dots){paintDots(dots,d.energy);dots.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const val=+b.dataset.v;d.energy=d.energy===val?0:val;paintDots(e.currentTarget,d.energy);save();afterChange();});}
  $('#prevDay').addEventListener('click',()=>showDay(pk));
  $('#nextDay').addEventListener('click',()=>showDay(nk));
  $('#todayDay').addEventListener('click',()=>showDay(todayKey));
  updateDaySummary();
}
function paintDots(host,val){host.innerHTML=[1,2,3,4,5].map(v=>'<button data-v="'+v+'" class="'+(val>=v?'on':'')+'" aria-label="'+v+' '+T_("из 5")+'" aria-pressed="'+(val===v)+'"></button>').join('');}
function addTask(k,text,index,obj){
  const d=state.days[k]; const t=obj||{id:uid(),t:text,done:false,pri:false};
  if(index==null||index>=d.tasks.length){index=d.tasks.length;d.tasks.push(t);}else{d.tasks.splice(index,0,t);}
  const c=col(k); let row=null;
  if(c){const list=c.querySelector('.tasks');row=taskEl(k,t);const ref=list.children[index];if(ref)list.insertBefore(row,ref);else list.appendChild(row);fit(row.querySelector('.txt'));}
  save(); updateRing(k); return row;
}
function removeTask(k,t,row){
  const d=state.days[k]; const i=d.tasks.indexOf(t); if(i>-1)d.tasks.splice(i,1);
  if(t.wish)taskWishSync(t,{removed:true});
  if(row)row.remove(); save(); updateRing(k); return i;
}
function taskEl(k,t){
  const d=state.days[k];
  const row=document.createElement('div');
  row.className='task'+(t.done?' done':'')+(t.pri?' pri':'');
  row.innerHTML='<input type="checkbox" class="check" aria-label="'+T_("Выполнено")+'"'+(t.done?' checked':'')+'>'+
    (t.pri?'<span class="pristar" title="'+T_("Приоритет")+'">★</span>':'')+(t.wish?'<span class="pristar" title="'+T_("Шаг к мечте")+'">🎯</span>':'')+
    '<textarea class="txt" rows="1" aria-label="'+T_("Текст задачи")+'" placeholder="'+T_("Задача")+'">'+esc(t.t)+'</textarea>'+
    '<div class="tools">'+
      '<button class="star'+(t.pri?' on':'')+'" title="'+T_("Приоритет")+'" aria-label="'+T_("Приоритет")+'" aria-pressed="'+!!t.pri+'">'+(t.pri?'★':'☆')+'</button>'+
      '<button class="mv" title="'+T_("Перенести на следующий день")+'" aria-label="'+T_("Перенести на следующий день")+'">→</button>'+
      '<button class="del" title="'+T_("Удалить")+'" aria-label="'+T_("Удалить")+'">×</button>'+
    '</div>';
  row.querySelector('.check').addEventListener('change',e=>{t.done=e.target.checked;row.classList.toggle('done',t.done);save();if(t.wish)taskWishSync(t,{done:t.done});updateRing(k);if(t.done)cheer(d.tasks.every(x=>x.done));});
  const txt=row.querySelector('.txt');
  txt.addEventListener('input',()=>{t.t=txt.value;fit(txt);save();if(t.wish)taskWishSync(t,{text:t.t});});
  txt.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const nr=addTask(k,'',d.tasks.indexOf(t)+1);if(nr)nr.querySelector('.txt').focus();}
    else if(e.key==='Backspace'&&txt.value===''){e.preventDefault();const i=removeTask(k,t,row);focusTask(k,i-1);}
  });
  txt.addEventListener('blur',()=>{if(txt.value.trim()===''&&d.tasks.includes(t))removeTask(k,t,row);});
  row.querySelector('.star').addEventListener('click',()=>{t.pri=!t.pri;const nr=taskEl(k,t);row.replaceWith(nr);fit(nr.querySelector('.txt'));save();afterChange();});
  row.querySelector('.del').addEventListener('click',()=>removeTask(k,t,row));
  row.querySelector('.mv').addEventListener('click',()=>moveTask(k,t,row));
  return row;
}
function focusTask(k,i){const c=col(k);if(!c)return;const inputs=c.querySelectorAll('.task .txt');if(!inputs.length||i<0){c.querySelector('.add input').focus();return;}inputs[Math.min(i,inputs.length-1)].focus();}
async function moveTask(k,t,row){
  const keys=Object.keys(state.days); const i=keys.indexOf(k);
  const moved=clone(t); delete moved.ex; moved.done=false;
  const d0=state.days[k]; const i0=d0.tasks.indexOf(t); if(i0>-1)d0.tasks.splice(i0,1); if(row)row.remove(); save(); updateRing(k);
  if(i<6){addTask(keys[i+1],'',null,moved);if(moved.wish)taskWishSync(moved,{date:keys[i+1]});toast(T_("Перенесено на")+' '+WDA[i+1]);}
  else{const nk=dkey(addDays(weekStart,7));const nw=await getWeek(nk);const mk=Object.keys(nw.days)[0];nw.days[mk].tasks.push(moved);save(nk);if(moved.wish)taskWishSync(moved,{date:mk});toast(T_("Перенесено на понедельник следующей недели"));}
}
function autosize(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
function fit(ta){if(!ta)return;ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
function fitAll(root){root.querySelectorAll('.txt').forEach(fit);}
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{fitAll(document);document.querySelectorAll('.note,.refl textarea').forEach(autosize);},150);});

function renderPanel(){
  const w=weekStats(state);
  $('#heroPct').innerHTML=w.pct+'<small>%</small>';
  $('#heroMeta').innerHTML=w.n?'<b>'+w.done+' '+T_("из")+' '+w.n+'</b> '+tasksGen(w.n)+'<br>'+T_("выполнено"):T_("задач пока нет")+'<br>'+T_("добавь их по дням");
  const best=w.per.filter(p=>p.n).sort((a,b)=>b.pct-a.pct||b.done-a.done)[0];
  $('#stats').innerHTML=
    '<div class="stat"><div class="v">'+(w.pn?w.pdone+'/'+w.pn:'—')+'</div><div class="k">'+T_("приоритеты")+'</div></div>'+
    '<div class="stat"><div class="v">'+(w.gn?w.gdone+'/'+w.gn:'—')+'</div><div class="k">'+T_("цели")+'</div></div>'+
    '<div class="stat"><div class="v">'+(best?WDS[Object.keys(state.days).indexOf(best.k)]:'—')+'</div><div class="k">'+T_("лучший день")+'</div></div>';
  $('#chart').innerHTML=chartSvg(w.per);
}
$('#chart').addEventListener('click',e=>{const g=e.target.closest('g.bg');if(g)showDay(g.dataset.k);});
function goalEl(g){
  const row=document.createElement('div'); row.className='goal'+(g.done?' done':'');
  row.innerHTML='<input type="checkbox" class="check" aria-label="'+T_("Цель достигнута")+'"'+(g.done?' checked':'')+'><textarea class="txt" rows="1" aria-label="'+T_("Текст цели")+'" placeholder="'+T_("Цель")+'">'+esc(g.t)+'</textarea><div class="tools"><button class="del" title="'+T_("Удалить")+'" aria-label="'+T_("Удалить")+'">×</button></div>';
  row.querySelector('.check').addEventListener('change',e=>{g.done=e.target.checked;row.classList.toggle('done',g.done);save();afterChange();});
  const txt=row.querySelector('.txt'); txt.addEventListener('input',()=>{g.t=txt.value;fit(txt);save();});
  txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#addGoal').focus();}else if(e.key==='Backspace'&&txt.value===''){e.preventDefault();removeGoal(g,row);$('#addGoal').focus();}});
  txt.addEventListener('blur',()=>{if(txt.value.trim()===''&&state.goals.includes(g))removeGoal(g,row);});
  row.querySelector('.del').addEventListener('click',()=>removeGoal(g,row));
  return row;
}
function renderGoals(){const host=$('#goals');host.innerHTML='';state.goals.forEach(g=>host.appendChild(goalEl(g)));fitAll(host);}
function removeGoal(g,row){const i=state.goals.indexOf(g);if(i>-1)state.goals.splice(i,1);row.remove();save();afterChange();}
const addGoal=$('#addGoal');
function commitGoal(){const v=addGoal.value.trim();if(!v)return;addGoal.value='';const g={id:uid(),t:v,done:false};state.goals.push(g);const row=goalEl(g);$('#goals').appendChild(row);fit(row.querySelector('.txt'));save();afterChange();}
addGoal.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitGoal();}});
addGoal.addEventListener('blur',commitGoal);

function renderReview(withText){
  const w=weekStats(state), keys=Object.keys(state.days);
  const withTasks=w.per.filter(p=>p.n);
  let verdict,items=[];
  if(!w.n){verdict=T_("Неделя пока пустая");items.push(T_("Добавь задачи по дням — итоги посчитаются сами."));}
  else{
    verdict=w.pct>=85?T_("Сильная неделя"):w.pct>=60?T_("Хорошая неделя"):w.pct>=35?T_("Неровная неделя"):T_("Неделя для разбора");
    items.push(T_("Выполнено")+' <b>'+w.done+' '+T_("из")+' '+w.n+'</b> '+tasksGen(w.n)+' — <b>'+w.pct+'%</b>'+(w.full?', '+w.full+' '+plural(w.full,T_("день"),T_("дня"),T_("дней"))+' '+T_("закрыто на 100%"):'')+'.');
    if(withTasks.length>1){
      const sorted=withTasks.slice().sort((a,b)=>b.pct-a.pct||b.done-a.done);
      const best=sorted[0],worst=sorted[sorted.length-1];
      if(best.pct!==worst.pct)items.push(T_("Самый продуктивный день —")+' <b>'+WD[keys.indexOf(best.k)]+'</b> ('+best.pct+'%), '+T_("слабее всего —")+' <b>'+WD[keys.indexOf(worst.k)]+'</b> ('+worst.pct+'%).');
      else items.push(T_("Все дни с задачами прошли одинаково ровно — по")+' '+best.pct+'%.');
    }
    if(w.pn)items.push(T_("Приоритеты:")+' <b>'+w.pdone+' '+T_("из")+' '+w.pn+'</b>'+(w.pdone===w.pn?' — '+T_("всё главное сделано."):w.pdone/w.pn<0.5?' — '+T_("главное провисло, стоит начать следующую неделю с них."):'.'));
    if(w.gn)items.push(T_("Цели недели:")+' <b>'+w.gdone+' '+T_("из")+' '+w.gn+'</b>.');
    if(w.energy){
      const e=w.energy.toFixed(1).replace('.',',');
      const lowE=w.per.filter(p=>state.days[p.k].energy&&state.days[p.k].energy<=2&&p.n);
      items.push(T_("Средняя энергия —")+' <b>'+e+' '+T_("из 5")+'</b>'+(lowE.length?'; '+T_("в дни с низкой энергией выполнение")+' '+Math.round(lowE.reduce((a,p)=>a+p.pct,0)/lowE.length)+'%.':'.'));
    }
    if(prevState){const pw=weekStats(prevState);if(pw.n){const diff=w.pct-pw.pct;items.push(diff===0?T_("Ровно как на прошлой неделе")+' ('+pw.pct+'%).':(diff>0?T_("На")+' <b>'+diff+' '+T_("п.п. лучше")+'</b>':T_("На")+' <b>'+Math.abs(diff)+' '+T_("п.п. ниже")+'</b>')+' '+T_("прошлой недели")+' ('+pw.pct+'%).');}}
  }
  $('#verdict').textContent=verdict;
  $('#summary').innerHTML=items.map(t=>'<li><span>'+t+'</span></li>').join('');
  const undone=[];for(const d of Object.values(state.days)){for(const t of d.tasks){if(!t.done&&t.t.trim())undone.push(t);}}
  const tr=$('#transfer');
  if(undone.length){
    tr.innerHTML='<button class="pill" id="trBtn">'+T_("Перенести невыполненное на следующую неделю")+'</button><span class="hint">'+undone.length+' '+tasksWord(undone.length)+'</span>';
    $('#trBtn').addEventListener('click',()=>{tr.innerHTML='<span class="hint">'+T_("Перенести")+' '+undone.length+' '+tasksWord(undone.length)+' '+T_("в те же дни следующей недели?")+'</span><button class="pill primary" id="trYes">'+T_("Да, перенести")+'</button><button class="pill" id="trNo">'+T_("Отмена")+'</button>';$('#trYes').addEventListener('click',transferAll);$('#trNo').addEventListener('click',()=>renderReview(false));});
  } else tr.innerHTML='<span class="hint">'+(w.n?T_("Невыполненных задач нет — переносить нечего."):'')+'</span>';
  if(withText){for(const ta of document.querySelectorAll('.refl textarea')){ta.value=state.review[ta.dataset.r]||'';autosize(ta);}}
}
document.querySelectorAll('.refl textarea').forEach(ta=>ta.addEventListener('input',()=>{state.review[ta.dataset.r]=ta.value;autosize(ta);save();}));
async function transferAll(){
  const nk=dkey(addDays(weekStart,7)); const nw=await getWeek(nk); const nkeys=Object.keys(nw.days); const keys=Object.keys(state.days);
  let n=0;
  keys.forEach((k,i)=>{const d=state.days[k];const keep=[];for(const t of d.tasks){if(!t.done&&t.t.trim()){const m=clone(t);delete m.ex;nw.days[nkeys[i]].tasks.push(m);n++;}else keep.push(t);}d.tasks=keep;});
  save(nk); save(); afterChange();
  const en=addDays(parse(nk),6);
  toast(T_("Перенесено:")+' '+n+' '+tasksWord(n)+' '+T_("на неделю")+' '+parse(nk).getDate()+' – '+en.getDate()+' '+MONTHS[en.getMonth()]);
}
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}


/* ---------------- storage: account store when available, else this browser ----------------
   Every record is a document in the viewer's private subtree data/users/<id>/:
   w-<monday> (week), profile, bg (background image), wish-<id> (one per wish).
   Without the account store: weeks + profile in localStorage, wishes + background in IndexedDB. */
const idb={p:null,
  open(){ if(this.p)return this.p; this.p=new Promise(res=>{ try{ const r=indexedDB.open('planner',1); r.onupgradeneeded=()=>r.result.createObjectStore('docs'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){res(null);} }); return this.p; },
  async get(k){ const d=await this.open(); if(!d)return null; return new Promise(res=>{ try{ const t=d.transaction('docs').objectStore('docs').get(k); t.onsuccess=()=>res(t.result||null); t.onerror=()=>res(null);}catch(e){res(null);} }); },
  async set(k,v){ const d=await this.open(); if(!d)throw new Error('no idb'); return new Promise((res,rej)=>{ const tx=d.transaction('docs','readwrite'); tx.objectStore('docs').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  async del(k){ const d=await this.open(); if(!d)return; return new Promise(res=>{ const tx=d.transaction('docs','readwrite'); tx.objectStore('docs').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); },
  async all(){ const d=await this.open(); if(!d)return {}; return new Promise(res=>{ try{ const st=d.transaction('docs').objectStore('docs'); const ks=st.getAllKeys(), vs=st.getAll(); vs.onsuccess=()=>{ const out={}; (ks.result||[]).forEach((k,i)=>out[k]=vs.result[i]); res(out); }; vs.onerror=()=>res({}); }catch(e){res({});} }); }
};
const isLS=id=>id.startsWith('w-')||id==='profile';
/* ids that have been seen in the account store at least once (per browser): lets us tell "never uploaded" from "deleted elsewhere" */
const synced={ key:'planner.synced', _s:null, _k:null,
  set(){ if(!this._s||this._k!==this.key){ this._k=this.key; this._s=new Set(); try{ const r=localStorage.getItem(this.key); if(r)JSON.parse(r).forEach(x=>this._s.add(x)); }catch(e){} } return this._s; },
  has(id){ return this.set().has(id); },
  add(id){ const st=this.set(); if(st.has(id))return; st.add(id); try{ localStorage.setItem(this.key,JSON.stringify([...st])); }catch(e){} },
  drop(id){ const st=this.set(); if(!st.delete(id))return; try{ localStorage.setItem(this.key,JSON.stringify([...st])); }catch(e){} },
};
const store={mode:'local',db:null,uid:null,
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
        if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode='db';}}
      }
    }catch(e){}
  },
  col(){return this.db.collection('data/users/'+this.uid);},
  async localGet(id){ if(isLS(id)){try{const r=localStorage.getItem('planner.'+id);return r?JSON.parse(r):null;}catch(e){return null;}} return idb.get(id); },
  async localSet(id,body){ if(isLS(id)){localStorage.setItem('planner.'+id,JSON.stringify(body));} else await idb.set(id,body); },

/* leaving the page: push every pending document right away instead of waiting for the debounce */

async function flush(id){
  const data=pendingDocs[id]; if(!data)return;
  if(inflight[id]){queued[id]=true;return;}
  dirty[id]=false;
  inflight[id]=(async()=>{try{data.updated=Date.now();await store.writeDoc(id,data);setStatus('',T_("Сохранено"));}
    catch(e){
      if(e&&e.queued)setStatus('',T_("Сохранено на устройстве — отправлю в аккаунт позже"));

  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error(T_("Это не изображение")));
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;let side=maxSide;URL.revokeObjectURL(url);
      const render=(ms,qq)=>{const sc=Math.min(1,ms/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);return c.toDataURL('image/jpeg',qq);};
      const MAX=170000; let qq=q, out=render(side,qq);
      while(out.length>MAX&&qq>.45){qq-=.1;out=render(side,qq);}
      while(out.length>MAX&&side>320){side=Math.round(side*.8);out=render(side,qq);}
      res(out);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(T_("Не удалось прочитать картинку")));};
    img.src=url;
  });
}

let modalEl=null;
function openModal(html,opts){
  closeModal();
  const o=document.createElement('div'); o.className='overlay'; o.innerHTML='<div class="sheet'+(opts&&opts.wide?' wide':'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  o.addEventListener('click',e=>{if(e.target===o)closeModal();});
  document.getElementById('modalHost').appendChild(o); modalEl=o; document.body.style.overflow='hidden';
  o.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));

  wrap.innerHTML='<span>'+label+'</span><button class="pill primary">'+T_("Да")+'</button><button class="pill">'+T_("Нет")+'</button>';

function quizAnswers(){return (P.quiz&&P.quiz.answers)||{};}
function quizQ(id){return QUIZ.find(q=>q.id===id)||null;}
function sel(id){const a=quizAnswers()[id];return Array.isArray(a)?a:[];}
function answerText(id){const q=quizQ(id);return sel(id).map(i=>q.o[i]).join(', ');}
function answeredCount(){return QUIZ.filter(q=>sel(q.id).length).length;}
function computeStyle(){
  const sc={st:0,c:0,e:0,p:0,b:0}; let any=false;
  for(const q of QUIZ){if(!q.w)continue;for(const i of sel(q.id)){any=true;const w=q.w[i]||{};for(const k in w)sc[k]+=w[k];}}
  if(!any)return null;
  return Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];
}
function quizTone(){const q=quizQ('tone');const s=sel('tone');return s.length?q.tone[s[0]]:null;}

function runQuiz(){
  const host=$('#onbHost'); const total=QUIZ.length;
  if(!P.quiz||P.quiz.v!==2){P.quiz={v:2,answers:{},done:false};}
  P.quiz.answers=P.quiz.answers||{}; P.quiz.inProgress=true;
  let i=(!P.quiz.done&&typeof P.quiz.pos==='number'&&P.quiz.pos>0&&P.quiz.pos<total)?P.quiz.pos:0;
  const fmtPct=n=>String(n*12.5).replace('.',',')+'%';
  function render(dir){
    const q=QUIZ[i]; const A=P.quiz.answers; const cur=sel(q.id); const n=answeredCount(); const pct=n*12.5; P.quiz.pos=i;
    host.innerHTML='<div class="onb quiz"><div class="card2 qcard '+(dir||'')+'">'+
      '<div class="qtop"><div class="qprog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><div class="qmeta"><span>'+n+' '+T_("из")+' '+total+' '+T_("отвечено")+'</span><span class="qpct">'+fmtPct(n)+'</span></div></div>'+
      '<div class="qnum">'+T_("Вопрос")+' '+(i+1)+(q.optional?' · '+T_("необязательный"):'')+'</div><h2 class="qt">'+phrase(q.t)+'</h2>'+(q.note?'<p class="fine" style="margin:-6px 0 0">'+q.note+'</p>':'')+
      '<div class="opts">'+q.o.map((o,k)=>'<button type="button" class="opt'+(cur.includes(k)?' on':'')+'" data-k="'+k+'" aria-pressed="'+cur.includes(k)+'"><span class="tick"></span>'+o+'</button>').join('')+'</div>'+
      '<span class="hint2">'+(q.exclusive!=null?T_("Можно выбрать несколько — кроме «Предпочитаю не отвечать», он только отдельно"):T_("Можно выбрать один или несколько вариантов"))+'</span>'+
      '<div class="sfoot" style="padding:0"><button class="pill" id="qBack">'+(i===0?T_("Выйти"):T_("Назад"))+'</button><span class="grow"></span><button class="pill" id="qSkip">'+T_("Пропустить")+'</button><button class="pill primary" id="qNext">'+(i===total-1?T_("Показать профиль"):T_("Далее"))+'</button></div></div></div>';
    const bar=host.querySelector('.qprog i'); requestAnimationFrame(()=>{bar.style.width=(answeredCount()*12.5)+'%';});
    host.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k; let s=sel(q.id).slice();
      if(q.exclusive!=null&&k===q.exclusive){s=s.includes(k)?[]:[k];}
      else{ if(q.exclusive!=null)s=s.filter(x=>x!==q.exclusive); const j=s.indexOf(k); if(j>-1)s.splice(j,1); else s.push(k); }
      A[q.id]=s; queueDoc('profile',P);
      host.querySelectorAll('.opt').forEach(x=>{const on=s.includes(+x.dataset.k);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
      const nn=answeredCount(); host.querySelector('.qprog i').style.width=(nn*12.5)+'%'; host.querySelector('.qmeta span').textContent=nn+' '+T_("из")+' '+total+' '+T_("отвечено"); host.querySelector('.qpct').textContent=fmtPct(nn);
    }));
    const go=d=>{queueDoc('profile',P);if(i+d<0){exit();return;}if(i+d>=total){done();return;}i+=d;render(d>0?'fwd':'back');};
    $('#qNext').addEventListener('click',()=>go(1));
    $('#qSkip').addEventListener('click',()=>{A[q.id]=[];go(1);});
    $('#qBack').addEventListener('click',()=>go(-1));
    host.querySelector('.onb').addEventListener('keydown',e=>{if(e.key==='Escape')exit();if(e.key==='Enter')go(1);});
    host.querySelector('.qcard').setAttribute('tabindex','-1'); host.querySelector('.qcard').focus({preventScroll:true});
  }
  function exit(){queueDoc('profile',P);host.innerHTML='';renderHome();}
  function done(){finishQuiz();host.innerHTML='';showStyle();toast(phrase('{n}, '+T_("готово ✨ Вот твой профиль предпочтений.")));}
  render('fwd');
}

function minutesSince(t){return nowMin()-hm(t);}
async function notifTick(force){
  const nf=NF(); if(!nf.on||!P.onboarded)return;
  const st=notifState(); const quiet=inQuiet(); const tone=toneKey(); const cap=capFor();
  const cw=cache[curWeekKey()]||await getWeek(curWeekKey()); const td=cw.days[todayKey]||{tasks:[]};
  const optionalCount=()=>st.keys.filter(k=>!k.startsWith('task-')&&!k.startsWith('step-')).length;
  const recent=t=>{const m=minutesSince(t);return m>=0&&m<=12;};
  const tryOpt=(key,text,link,fresh)=>{if(st.keys.includes(key))return;if(quiet)return;if(optionalCount()>=cap)return;deliver(key,text,link,{silent:!fresh});};
  // morning / day / evening
  if(tone){
    if(minutesSince(nf.morning)>=0)tryOpt('morning',phrase(pick(NT.morning[tone],'nm')),'#day-'+todayKey,recent(nf.morning)||force);
    if(nf.dayOn&&minutesSince(nf.day)>=0&&td.tasks.some(t=>!t.done))tryOpt('day',phrase(pick(NT.day[tone],'nd')),'#day-'+todayKey,recent(nf.day)||force);
    if(minutesSince(nf.evening)>=0&&td.tasks.length)tryOpt('evening',phrase(pick(NT.evening[tone],'ne')),'#week-'+curWeekKey(),recent(nf.evening)||force);
    if(nf.motiv&&minutesSince('15:00')>=0)tryOpt('motiv',phrase(pick(motivPool(),'m50')),'',recent('15:00')||force);
    if(nf.wishes&&wishes.length&&Date.now()-(st.lastWishVisit||0)>7*864e5)tryOpt('wish',phrase(pick(NT.wish,'nw')),'#wishes',force);
  }
  // tasks with a time in the text, 10 minutes before, only while not done
  if(nf.taskTimes&&!quiet){for(const t of td.tasks){if(t.done)continue;const tm=timeInText(t.t);if(tm==null)continue;const diff=tm-nowMin();if(diff<=10&&diff>-45){deliver('task-'+t.id,phrase(pick(NT.task,'nt')).replace('{t}',String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0')).replace('{task}',t.t),'#day-'+todayKey);}}}
  // goals: steps due today / in a few days
  if(nf.goals&&!quiet){
    const fromMorning=minutesSince(nf.morning)>=0;
    for(const w of wishes){ if(!w.isGoal||w.done)continue;
      for(const s of w.steps){ if(s.done||!s.date)continue;
        const d=Math.round((parse(s.date)-parse(todayKey))/864e5);
        if(d===0&&fromMorning)deliver('step-'+s.id,phrase(NT.goal[1]).replace('{g}',w.title).replace('{s}',s.t),'#day-'+s.date,{silent:!force&&!recent(nf.morning)});
        else if((d===1||d===3||d===7)&&fromMorning)tryOpt('goalsoon-'+s.id,phrase(NT.goal[2]).replace('{g}',w.title).replace('{s}',s.t).replace('{d}',d).replace(T_("{дн}"),pluralDays(d)),'#wish-'+w.id,false);
      }
      if(!w.steps.length&&fromMorning&&(Date.now()-(w.updated||w.created||0))>5*864e5)tryOpt('goalidle-'+w.id,phrase(NT.goal[0]).replace('{g}',w.title),'#wish-'+w.id,false);
    }
  }
}

let BAL=null;
function normBalance(d){
  const out={type:'balance',entries:[],updated:0,seenHelp:false};
  if(d&&typeof d==='object'){ if(Array.isArray(d.entries))out.entries=d.entries.filter(e=>e&&e.date&&e.scores); out.updated=d.updated||0; out.seenHelp=!!d.seenHelp; }
  out.entries.sort((a,b)=>a.date<b.date?-1:1);
  return out;
}
async function loadBalance(){ if(BAL)return BAL; let d=null; try{d=await store.loadDoc('balance');}catch(e){} BAL=normBalance(d); return BAL; }
function saveBalance(){ if(!BAL)return; BAL.updated=Date.now(); queueDoc('balance',BAL); }
function balLatest(){ return BAL&&BAL.entries.length?BAL.entries[BAL.entries.length-1]:null; }
function balPrev(){ return BAL&&BAL.entries.length>1?BAL.entries[BAL.entries.length-2]:null; }
function balScore(e,id){ const v=e&&e.scores?Number(e.scores[id]):0; return isFinite(v)?Math.max(0,Math.min(10,v)):0; }
function balAvg(e){ if(!e)return 0; const vals=AREAS.map(a=>balScore(e,a.id)); return Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*10)/10; }
function balFilled(e){ return !!e&&AREAS.some(a=>balScore(e,a.id)>0); }
/* editing always lands in today's entry; a new day starts from the previous scores so history stays comparable */
function balToday(){
  let e=balLatest();
  if(!e||e.date!==todayKey){ const base=e?Object.assign({},e.scores):{}; e={id:uid(),date:todayKey,scores:base,note:''}; BAL.entries.push(e); }
  return e;
}
function setBalScore(id,v){ const e=balToday(); e.scores[id]=Math.max(0,Math.min(10,Math.round(v))); saveBalance(); }

/* wheel: 8 sectors, value = radius; previous assessment as a dashed outline */
function wheelSvg(e,prev,size,opts){
  opts=opts||{}; const compact=!!opts.labels&&size<420; const n=AREAS.length, cx=size/2, cy=size/2, pad=opts.labels?(compact?74:44):6, R=size/2-pad, step=Math.PI*2/n, start=-Math.PI/2;
  const pt=(i,r)=>[cx+Math.cos(start+i*step)*r, cy+Math.sin(start+i*step)*r];
  const arc=(i,r)=>{const [x1,y1]=pt(i,r),[x2,y2]=pt(i+1,r);return 'M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 0 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z';};
  let s='<svg class="wheel'+(opts.labels?'':' mini')+'" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+esc(opts.aria||T_("Колесо баланса"))+'">';
  for(let k=1;k<=10;k++){ s+='<circle class="grid'+(k%5===0?' big':'')+'" cx="'+cx+'" cy="'+cy+'" r="'+(R*k/10).toFixed(1)+'"/>'; }
  for(let i=0;i<n;i++){ const [x,y]=pt(i,R); s+='<line class="grid" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'; }
  for(let i=0;i<n;i++){ const v=balScore(e,AREAS[i].id); if(v>0)s+='<path class="wedge" data-i="'+i+'" style="fill:'+AREAS[i].color+'" d="'+arc(i,R*v/10)+'"><title>'+esc(AREAS[i].name)+': '+v+'</title></path>'; }
  if(prev&&balFilled(prev)){ const pts=AREAS.map((a,i)=>{const r=R*balScore(prev,a.id)/10;const ang=start+(i+.5)*step;return (cx+Math.cos(ang)*r).toFixed(1)+','+(cy+Math.sin(ang)*r).toFixed(1);}); s+='<polygon class="prev" points="'+pts.join(' ')+'"/>'; }
  for(let i=0;i<n;i++){ s+='<path class="hit" data-i="'+i+'" style="fill:'+AREAS[i].color+'" d="'+arc(i,R)+'"/>'; }
  if(opts.labels){
    for(let i=0;i<n;i++){ const ang=start+(i+.5)*step, off=compact?10:22, lx=cx+Math.cos(ang)*(R+off), ly=cy+Math.sin(ang)*(R+off); const anchor=Math.abs(Math.cos(ang))<.3?'middle':(Math.cos(ang)>0?'start':'end'); const v=balScore(e,AREAS[i].id);
      if(compact){ const up=Math.sin(ang)<-.3, down=Math.sin(ang)>.3; const y0=up?ly-7:down?ly+7:ly; s+='<text class="lab small" x="'+lx.toFixed(1)+'" y="'+y0.toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="middle"><tspan x="'+lx.toFixed(1)+'" dy="-6">'+AREAS[i].emoji+' '+esc(AREAS[i].short)+'</tspan><tspan x="'+lx.toFixed(1)+'" dy="13" class="sc">'+(v?v:'—')+'</tspan></text>'; }
      else s+='<text class="lab" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+AREAS[i].emoji+' '+esc(AREAS[i].short)+(v?' · '+v:'')+'</text>'; }
  }
  const avg=balAvg(e);
  s+='<circle class="core" cx="'+cx+'" cy="'+cy+'" r="'+(opts.labels?26:16)+'"/><text class="avg" x="'+cx+'" y="'+(cy+1)+'" text-anchor="middle" dominant-baseline="middle">'+(balFilled(e)?String(avg).replace('.',','):'—')+'</text></svg>';
  return s;
}
function balSummary(e){
  if(!balFilled(e))return null;
  const list=AREAS.map(a=>({a,v:balScore(e,a.id)})).sort((x,y)=>x.v-y.v);
  const low=list.filter(x=>x.v<=5).slice(0,3); const lows=low.length?low:list.slice(0,2);
  const high=list.slice().reverse().filter(x=>x.v>=7).slice(0,3); const highs=high.length?high:list.slice(-2).reverse();
  const spread=list[list.length-1].v-list[0].v;
  const shape=spread<=2?T_("Колесо ровное — сферы в балансе, его легко «катить»."):spread<=4?T_("Есть перекос: несколько сфер заметно отстают и тянут остальные."):T_("Сильный перекос: колесо «не катится» — одна-две сферы сильно просели.");
  return {avg:balAvg(e),lows,highs,spread,shape};
}

let EXP=null, expMonth=null;
function normExp(d){
  const out={type:'expenses',items:[],budget:0,currency:'₴',cats:[],names:{},lastPay:'card',updated:0};
  if(d&&typeof d==='object'){
    if(Array.isArray(d.items))out.items=d.items.filter(x=>x&&x.id&&x.date&&isFinite(+x.amount)).map(x=>({id:x.id,date:x.date,amount:Math.round(+x.amount*100)/100,cat:x.cat||'other',pay:x.pay==='cash'?'cash':'card',note:x.note||'',created:x.created||0}));
    out.lastPay=d.lastPay==='cash'?'cash':'card';
    out.budget=isFinite(+d.budget)?Math.max(0,+d.budget):0; out.currency=(d.currency||'₴').slice(0,4); out.updated=d.updated||0;
    if(Array.isArray(d.cats))out.cats=d.cats.filter(c=>c&&c.id&&c.name).map(c=>({id:c.id,emoji:c.emoji||'📌',name:c.name}));
    if(d.names&&typeof d.names==='object')for(const k of Object.keys(d.names)){const n=d.names[k];if(n&&(n.name||n.emoji))out.names[k]={emoji:n.emoji||'',name:n.name||''};}
  }
  out.items.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0));
  return out;
}
async function loadExp(){ if(EXP)return EXP; let d=null; try{d=await store.loadDoc('expenses');}catch(e){} EXP=normExp(d); return EXP; }

function monthKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthItems(mk){ return EXP?EXP.items.filter(x=>x.date.slice(0,7)===mk):[]; }
function sum(list){ return Math.round(list.reduce((s,x)=>s+x.amount,0)*100)/100; }
function fmtMoney(n){ n=Math.round(n*100)/100; const neg=n<0; n=Math.abs(n); const [i,f]=n.toFixed(2).split('.'); const ip=i.replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (neg?'−':'')+ip+(f==='00'?'':','+f); }

const MONTHS_NOM=[T_("Январь"),T_("Февраль"),T_("Март"),T_("Апрель"),T_("Май"),T_("Июнь"),T_("Июль"),T_("Август"),T_("Сентябрь"),T_("Октябрь"),T_("Ноябрь"),T_("Декабрь")];
function monthTitle(mk){ const [y,m]=mk.split('-').map(Number); return MONTHS_NOM[m-1]+' '+y; }
function shiftMonth(mk,n){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+n,1); return monthKey(d); }
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }
function expStats(mk){
  const items=monthItems(mk), total=sum(items); const byCat={}; items.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+x.amount;});
  const cats=Object.keys(byCat).map(id=>({id,v:Math.round(byCat[id]*100)/100,pct:total?Math.round(byCat[id]/total*100):0})).sort((a,b)=>b.v-a.v);
  const cur=mk===monthKey(); const dim=daysInMonth(mk); const elapsed=cur?new Date().getDate():dim;
  const perDay=elapsed?total/elapsed:0; const forecast=cur?perDay*dim:total;
  const prev=sum(monthItems(shiftMonth(mk,-1)));
  const byDay={}; items.forEach(x=>{byDay[x.date]=(byDay[x.date]||0)+x.amount;});
  const cash=sum(items.filter(x=>x.pay==='cash')), card=Math.round((total-cash)*100)/100;
  return {items,total,cats,perDay,forecast,prev,byDay,dim,cur,elapsed,cash,card};
}
function expDayChart(st,mk){
  const W=320,H=96,base=74,top=12,n=st.dim,gap=2,bw=Math.max(3,(W-12-gap*(n-1))/n);

  for(let d=1;d<=n;d++){ const k=mk+'-'+String(d).padStart(2,'0'); const v=st.byDay[k]||0; const x=6+(d-1)*(bw+gap); const h=v?Math.max(2,(base-top)*v/max):0;
    s+='<rect class="track" x="'+x.toFixed(1)+'" y="'+top+'" width="'+bw.toFixed(1)+'" height="'+(base-top)+'" rx="2"/>';
    if(v)s+='<rect class="bar'+(k===todayKey?' today':'')+'" x="'+x.toFixed(1)+'" y="'+(base-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"><title>'+d+': '+money(v)+'</title></rect>';
    if(d===1||d%5===0||(d===n&&n%5>=3))s+='<text class="wd" x="'+(x+bw/2).toFixed(1)+'" y="'+(base+14)+'" text-anchor="middle">'+d+'</text>'; }
  return s+'</svg>';
}

function chartSvg(per){
  const W=240,H=108,base=82,top=14,bw=22,step=(W-12-bw)/6;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T_("Выполнение по дням недели")+'">';
  per.forEach((p,i)=>{
    const x=6+i*step, h=Math.max(0,(base-top)*p.pct/100), y=base-h, isT=p.k===todayKey;
    svg+='<g class="bg" data-k="'+p.k+'" style="cursor:pointer"><title>'+WD[i]+': '+(p.n?p.done+' '+T_("из")+' '+p.n+' ('+p.pct+'%)':T_("нет задач"))+' — '+T_("открыть день")+'</title>';
    svg+='<rect class="track" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+(base-top)+'" rx="4"/>';
    if(p.n&&p.pct>0){const r=Math.min(4,h);svg+='<path class="bar'+(isT?' today':'')+'" d="M'+x+' '+base+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+base+'Z"/>';}
    if(p.n){svg+='<text class="val" x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle">'+p.pct+'</text>';}
    svg+='<text class="wd'+(isT?' today':'')+'" x="'+(x+bw/2)+'" y="'+(base+15)+'" text-anchor="middle">'+WDS[i]+'</text></g>';
  });
  return svg+'</svg>';
}

/* «⋯» on a card: quick actions without opening the dream */
let menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;}}
document.addEventListener('click',e=>{if(menuEl&&!e.target.closest('.popmenu'))closeMenu();});

function openWishMenu(w,anchor){

/* steps <-> calendar tasks */
async function weekFor(k){return getWeek(dkey(mondayOf(parse(k))));}
function refreshIfVisible(k){const wkk=dkey(mondayOf(parse(k)));if(wkk===wk){if(view.type==='day'&&view.k===k)renderDayPage(k);afterChange();}renderHome();}
async function stepAddTask(w,st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;if(!d.tasks.some(t=>t.id===st.id))d.tasks.push({id:st.id,t:st.t,done:st.done,pri:true,wish:w.id});save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}
async function stepSetDone(w,st,done){st.done=done;st.doneAt=done?Date.now():0;saveWish(w);if(done)goalProgressNotify(w);if(st.date){const wobj=await weekFor(st.date);const d=wobj.days[st.date];const t=d&&d.tasks.find(x=>x.id===st.id);if(t){t.done=done;save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}renderWishes();renderHome();}
async function unlinkStepTask(st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;const i=d.tasks.findIndex(x=>x.id===st.id);if(i>-1){d.tasks.splice(i,1);save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}
async function stepRemove(w,st){w.steps=w.steps.filter(x=>x!==st);saveWish(w);if(st.date)await unlinkStepTask(st);renderWishes();renderHome();}
function taskWishSync(t,ch){const w=wishes.find(x=>x.id===t.wish);if(!w)return;const st=w.steps.find(s=>s.id===t.id);if(!st)return;if(ch.removed){w.steps=w.steps.filter(s=>s!==st);}else{if(ch.done!=null){st.done=ch.done;st.doneAt=ch.done?Date.now():0;}if(ch.text!=null)st.t=ch.text;if(ch.date!=null)st.date=ch.date;}saveWish(w);if(ch.done)goalProgressNotify(w);renderHome();}

/* examples follow the interface language: after a language switch they are regenerated once (user's own items stay) */
async function relocalizeExamples(){
  let flag=false; try{flag=localStorage.getItem('planner.relocEx')==='1'; if(flag)localStorage.removeItem('planner.relocEx');}catch(e){}
  if(!flag)return false;
  /*i18n-off*/
  const anyL=ru=>[ru,(I18N.uk||{})[ru],(I18N.en||{})[ru]].filter(Boolean);
  const NOTES=[...anyL('После 18:00 уже не было сил на чтение'),...anyL('Проект уехал на понедельник')];
  const EXN=anyL('Все приоритеты по работе закрыты до четверга');
  const DEF_RU={home:'Мой дом',travel:'Путешествия',career:'Карьера',buy:'Покупки'};
  /*i18n-on*/
  let changed=false;
  const wkey=wk||dkey(mondayOf(new Date())); const cur=await getWeek(wkey);
  if(cur&&hasExamples(cur)){
    const fresh=sampleWeek(wkey); const fks=Object.keys(fresh.days);
    Object.keys(cur.days).forEach((k,i)=>{const d=cur.days[k], f=fresh.days[fks[i]]; if(!d||!f)return;
      const own=d.tasks.filter(t=>!t.ex); if(own.length!==d.tasks.length)d.tasks=f.tasks.concat(own);
      if(NOTES.includes(d.note))d.note=f.note||'';});
    const ownG=cur.goals.filter(g=>!g.ex); if(ownG.length!==cur.goals.length)cur.goals=fresh.goals.concat(ownG);
    if(EXN.includes(cur.review.good))cur.review.good=EX_NOTE;
    save(wkey); changed=true;
  }
  if(wishes.some(w=>w.ex)){
    const old=wishes.filter(w=>w.ex); const keep=wishes.filter(w=>!w.ex);
    for(const w of old){delete pendingDocs['wish-'+w.id]; try{await store.deleteDoc('wish-'+w.id);}catch(e){}}
    wishes=sampleWishes().concat(keep); persistSampleWishes(); changed=true;
  }
  let pf=false; (P.folders||[]).forEach(f=>{const ru=DEF_RU[f.id]; if(ru&&anyL(ru).includes(f.name)&&f.name!==T_(ru)){f.name=T_(ru);pf=true;}});
  if(pf){saveProfile();changed=true;}
  return changed;
}

/* ================= standalone app: accounts (Supabase), offline mirror, anonymous usage stats, admin page ================= */
const CFG=window.PLANER_CONFIG||{};
const SB_ON=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let sb=null, sbUser=null;
const guestKeys=()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('planner.')&&!k.startsWith('planner.u.'));}catch(e){return [];}};
/* local mirror keyed by account, so several people on one device never see each other's data */
const mirror={
  key(id){return 'planner.u.'+(sbUser?sbUser.id.slice(0,8):'guest')+'.'+id;},
  async get(id){ if(isLS(id)){try{const r=localStorage.getItem(this.key(id));return r?JSON.parse(r):null;}catch(e){return null;}} return idb.get(this.key(id)); },
  async set(id,body){ if(isLS(id)){localStorage.setItem(this.key(id),JSON.stringify(body));} else await idb.set(this.key(id),body); },
  async del(id){ try{ if(isLS(id))localStorage.removeItem(this.key(id)); else await idb.del(this.key(id)); }catch(e){} },
  async wishes(){ const all=await idb.all(); const pre=this.key('wish-'); return Object.entries(all).filter(([k])=>k.startsWith(pre)).map(([,v])=>v); },
};
const outbox={
  key(){return 'outbox.'+(sbUser?sbUser.id.slice(0,8):'guest');},
  async get(){ try{return (await idb.get(this.key()))||{};}catch(e){return {};} },
  async has(id){ return id in (await this.get()); },
  async add(id,body){ try{const o=await this.get(); o[id]=body===null?null:body; await idb.set(this.key(),o);}catch(e){} },
  async remove(id){ try{const o=await this.get(); if(id in o){delete o[id]; await idb.set(this.key(),o);}}catch(e){} },
  async flush(){ if(!sb||!sbUser||!navigator.onLine)return; const o=await this.get(); const ids=Object.keys(o); if(!ids.length)return;
    for(const id of ids){ try{ if(o[id]===null){const {error}=await sb.from('docs').delete().eq('id',id); if(error)throw error; synced.drop(id);} else {const {error}=await sb.from('docs').upsert({user_id:sbUser.id,id,data:o[id],updated_at:new Date().toISOString()}); if(error)throw error; synced.add(id);} delete o[id]; }catch(e){ break; } }
    try{await idb.set(this.key(),o);}catch(e){} if(!Object.keys(o).length)setStatus('',T_("Синхронизировано")); else setTimeout(()=>this.flush(),30000); }
};
setInterval(()=>outbox.flush(),120000);
const cloud={
  /* newest copy wins: the account row or this device's mirror, whichever was updated last */
  async loadDoc(id){
    const local=await mirror.get(id);
    if(!navigator.onLine)return local;
    let cloudDoc=null, ok=false;
    try{ const {data,error}=await sb.from('docs').select('data').eq('id',id).maybeSingle(); if(!error){ ok=true; cloudDoc=data?clone(data.data):null; } }catch(e){}
    if(!ok)return local;
    const lu=(local&&local.updated)||0, cu=(cloudDoc&&cloudDoc.updated)||0;
    if(local&&!cloudDoc){ if(synced.has(id)&&!(await outbox.has(id))){ await mirror.del(id); return null; } this.writeDoc(id,local).catch(()=>{}); return local; }
    if(local&&cloudDoc&&lu>cu){ this.writeDoc(id,local).catch(()=>{}); return local; }
    if(cloudDoc){ synced.add(id); await mirror.set(id,cloudDoc); }
    return cloudDoc;
  },
  async writeDoc(id,data){
    const body=clone(data); await mirror.set(id,body);
    try{ if(!navigator.onLine)throw new Error('offline'); const {error}=await sb.from('docs').upsert({user_id:sbUser.id,id,data:body,updated_at:new Date().toISOString()}); if(error)throw error; synced.add(id); await outbox.remove(id); }
    catch(e){ await outbox.add(id,body); setTimeout(()=>outbox.flush(),15000); throw Object.assign(new Error('queued'),{queued:true}); }
  },
  async deleteDoc(id){ await mirror.del(id); try{ if(!navigator.onLine)throw new Error('offline'); const {error}=await sb.from('docs').delete().eq('id',id); if(error)throw error; synced.drop(id); await outbox.remove(id); }catch(e){ await outbox.add(id,null); setTimeout(()=>outbox.flush(),15000); } },
  async listWishes(){
    const local=await mirror.wishes();
    if(!navigator.onLine)return local;
    let arr=null; try{ const {data,error}=await sb.from('docs').select('data').like('id','wish-%'); if(!error&&data)arr=data.map(r=>clone(r.data)); }catch(e){}
    if(!arr)return local;
    const byId={}; for(const w of arr){ byId[w.id]=w; synced.add('wish-'+w.id); await mirror.set('wish-'+w.id,w); }
    const ob=await outbox.get();
    for(const w of local){ const id='wish-'+w.id, c=byId[w.id];
      if(!c){ if(synced.has(id)&&!(id in ob)){ await mirror.del(id); continue; } byId[w.id]=w; this.writeDoc(id,w).catch(()=>{}); }
      else if((w.updated||0)>(c.updated||0)){ byId[w.id]=w; this.writeDoc(id,w).catch(()=>{}); } }
    return Object.values(byId);
  },
};

    (mode==='reset'?'':'<div class="frow"><label class="label" for="aPass">'+T_("Пароль")+'</label><input type="password" id="aPass" required minlength="6" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" placeholder="'+T_("не короче 6 символов")+'"></div>')+
    '<div class="authmsg" id="authMsg" hidden></div>'+
    '<div class="sfoot" style="padding:0;margin-top:4px">'+(mode==='login'?'<button type="button" class="linkbtn" id="aForgot">'+T_("Забыла пароль?")+'</button>':mode==='reset'?'<button type="button" class="linkbtn" id="aBack">← '+T_("Ко входу")+'</button>':'')+'<span class="grow"></span><button class="pill primary" type="submit" id="aSubmit">'+(mode==='login'?T_("Войти"):mode==='signup'?T_("Создать аккаунт"):T_("Отправить ссылку"))+'</button></div></form>'+
    '<p class="fine" style="margin:0">'+(mode==='signup'?T_("Регистрируясь, ты получаешь личное пространство: задачи, мечты и ответы анкеты видишь только ты. Для статистики приложения считается лишь факт использования — без содержимого."):T_("Данные хранятся в твоём аккаунте и доступны с любого устройства."))+'</p>'+
    '<div class="authlang" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+[['ru',T_("Русский")],['uk',T_("Українська")],['en','English']].map(([k,n])=>'<button type="button" class="pill'+(k===LANG?' primary':'')+'" data-lang="'+k+'" style="font-size:12px;padding:4px 10px">'+n+'</button>').join('')+'</div></div></div>';
}
function showAuth(mode){
  const host=$('#onbHost'); host.innerHTML=authHtml(mode||'login');
  const tabs=$('#authTabs'); if(tabs)tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)showAuth(b.dataset.m);});
  const msg=(t,ok)=>{const m=$('#authMsg');m.hidden=false;m.textContent=t;m.className='authmsg'+(ok?' ok':'');};
  const forgot=$('#aForgot'); if(forgot)forgot.addEventListener('click',()=>showAuth('reset'));
  const back=$('#aBack'); if(back)back.addEventListener('click',()=>showAuth('login'));
  host.querySelectorAll('.authlang button').forEach(b=>b.addEventListener('click',()=>{const l=b.dataset.lang; if(l===LANG)return; try{localStorage.setItem('planner.lang',l);}catch(e){} location.reload();}));
  $('#authForm').addEventListener('submit',async e=>{
    e.preventDefault(); const email=$('#aEmail').value.trim(); const pass=$('#aPass')?$('#aPass').value:''; const btn=$('#aSubmit'); btn.disabled=true;
    try{
      if(mode==='signup'){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}}); if(error)throw error;
        if(data.session){ /* confirmation disabled: signed in right away */ } else msg(T_("Почти готово: мы отправили письмо на")+' '+email+'. '+T_("Открой ссылку из него — и можно входить."),true); }
      else if(mode==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error)throw error; msg(T_("Если такой аккаунт есть, письмо со ссылкой уже в пути."),true); }
      else { const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error)throw error; }
    }catch(err){ msg(authError(err)); }
    btn.disabled=false;
  });
  setTimeout(()=>{const f=$('#aEmail');if(f)f.focus();},60);
}
function authError(err){const m=(err&&err.message)||'';if(/Invalid login credentials/i.test(m))return T_("Неверный")+' e-mail '+T_("или пароль.");if(/already registered|already exists/i.test(m))return T_("Такой")+' e-mail '+T_("уже зарегистрирован — попробуй войти.");if(/Email not confirmed/i.test(m))return 'E-mail '+T_("ещё не подтверждён — открой письмо и перейди по ссылке.");if(/Password should be/i.test(m))return T_("Пароль слишком короткий — минимум 6 символов.");if(/rate limit|too many/i.test(m))return T_("Слишком много попыток — подожди минуту.");if(/network|fetch/i.test(m))return T_("Нет связи с сервером. Проверь интернет.");return T_("Не получилось:")+' '+(m||T_("попробуй ещё раз"));}
function showPasswordReset(){
  const host=$('#onbHost'); host.innerHTML='<div class="onb auth"><div class="card2"><h2>'+T_("Новый пароль")+'</h2><form id="pwForm"><div class="frow"><label class="label" for="npw">'+T_("Пароль")+'</label><input type="password" id="npw" minlength="6" required autocomplete="new-password"></div><div class="authmsg" id="authMsg" hidden></div><div class="sfoot" style="padding:0"><span class="grow"></span><button class="pill primary" type="submit">'+T_("Сохранить")+'</button></div></form></div></div>';
  $('#pwForm').addEventListener('submit',async e=>{e.preventDefault();try{const {error}=await sb.auth.updateUser({password:$('#npw').value});if(error)throw error;host.innerHTML='';toast(T_("Пароль обновлён"));}catch(err){const m=$('#authMsg');m.hidden=false;m.textContent=authError(err);}});
}
async function signOut(){ if(sb){await sb.auth.signOut();} }

/* ---- owner-only usage page: counts and dates only ---- */
function isAdmin(){return !!(sbUser&&CFG.ADMIN_EMAIL&&sbUser.email&&sbUser.email.toLowerCase()===String(CFG.ADMIN_EMAIL).toLowerCase());}
async function renderAdmin(){
  const v=$('#viewAdmin'); if(v.hidden)return;
  if(!isAdmin()){v.innerHTML='<div class="sec"><p style="margin:0">'+T_("Эта страница доступна только владельцу приложения.")+'</p></div>';return;}
  v.innerHTML='<div class="growhead"><div><h2>'+T_("Статистика приложения")+'</h2><div class="tag">'+T_("Только обезличенные счётчики: сколько людей зарегистрировалось и как часто пользуются. Без имён, задач и ответов.")+'</div></div><button class="pill" id="adRefresh">'+T_("Обновить")+'</button></div><div class="empty">'+T_("Считаю…")+'</div>';
  $('#adRefresh').addEventListener('click',renderAdmin);
  let s=null; try{const {data,error}=await sb.rpc('admin_stats');if(error)throw error;s=data;}catch(e){v.querySelector('.empty').textContent=T_("Не удалось получить статистику:")+' '+(e.message||e)+'. '+T_("Проверь, что")+' SQL-'+T_("схема выполнена и")+' e-mail '+T_("владельца совпадает с")+' ADMIN_EMAIL.';return;}
  const tile=(val,label)=>'<div class="gtile"><div class="v">'+val+'</div><div class="k">'+label+'</div></div>';
  const days=(s.by_day||[]); const max=Math.max(1,...days.map(d=>Math.max(d.active||0,d.new_users||0)));
  const W=560,H=150,top=16,base=118,n=days.length,gap=3,bw=n?Math.max(3,(W-12-gap*(n-1))/n):10;
  let chart='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T_("Активные пользователи по дням")+'">';
  days.forEach((d,i)=>{const x=6+i*(bw+gap);const h=(base-top)*(d.active||0)/max;const y=base-h;chart+='<g><title>'+d.day+': '+T_("активных")+' '+(d.active||0)+', '+T_("новых")+' '+(d.new_users||0)+'</title><rect class="track" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+(base-top)+'" rx="3"/>'+((d.active||0)>0?'<rect class="bar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3"/>':'')+(i%5===0?'<text class="wd" x="'+(x+bw/2)+'" y="'+(base+16)+'" text-anchor="middle">'+d.day.slice(5)+'</text>':'')+'</g>';});
  chart+='</svg>';
  const plat=Object.entries(s.by_platform||{}).sort((a,b)=>b[1]-a[1]);
  v.innerHTML='<div class="growhead"><div><h2>'+T_("Статистика приложения")+'</h2><div class="tag">'+T_("Только обезличенные счётчики: сколько людей зарегистрировалось и как часто пользуются. Без имён, задач и ответов.")+'</div></div><button class="pill" id="adRefresh">'+T_("Обновить")+'</button></div>'+
    '<div class="gtiles">'+tile(s.total_users||0,T_("всего аккаунтов"))+tile(s.new_7d||0,T_("новых за 7 дней"))+tile(s.new_30d||0,T_("новых за 30 дней"))+tile(s.active_today||0,T_("активных сегодня"))+tile(s.active_7d||0,T_("активных за 7 дней"))+tile(s.active_30d||0,T_("активных за 30 дней"))+'</div>'+
    '<section class="sec"><div class="whead"><span class="label">'+T_("Активные по дням")+'</span><span class="fine">'+T_("последние 30 дней")+'</span></div><div class="chart gchart">'+chart+'</div></section>'+
    '<div class="wgrid"><section class="sec"><h3>'+T_("Путь пользователя")+'</h3><div class="arow"><span class="an">'+T_("Прошли знакомство")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.onboarded||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.onboarded||0)+'</span></div><div class="arow"><span class="an">'+T_("Прошли анкету")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.quiz_done||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.quiz_done||0)+'</span></div></section>'+
    '<section class="sec"><h3>'+T_("Устройства")+'</h3>'+(plat.length?plat.map(([k,n])=>'<div class="arow"><span class="an">'+esc(k)+'</span><div class="bar"><i style="width:'+Math.round(n/plat[0][1]*100)+'%"></i></div><span class="av">'+n+'</span></div>').join(''):'<div class="empty">'+T_("Пока нет данных.")+'</div>')+'</section></div>';
  $('#adRefresh').addEventListener('click',renderAdmin);
}
function showAdmin(){view={type:'admin'};showView('admin');renderAdmin();setHash('#admin');}

/* ---- install prompt (Android shows a button; iPhone gets a one-line hint) ---- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#installBtn');if(b)b.hidden=false;});
function installHint(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; if(standalone)return '';
  if(installEvt)return '<button class="pill primary" id="installBtn">'+T_("Установить приложение")+'</button>';
  if(/iPhone|iPad/.test(navigator.userAgent))return '<span class="fine">'+T_("Чтобы поставить иконку на экран: Поделиться")+' <span style="font-size:15px">⎙</span> → '+T_("«На экран Домой».")+'</span>';
  return '<span class="fine">'+T_("В меню браузера выбери «Установить приложение» или «Добавить на главный экран».")+'</span>';
}
document.addEventListener('click',e=>{const b=e.target.closest('#installBtn');if(!b||!installEvt)return;installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;b.hidden=true;});});
/* updates: a new build is picked up when the app is opened or brought back to the foreground; the page reloads once the new version is in control */
if('serviceWorker' in navigator){
  let swReg=null, hadController=!!navigator.serviceWorker.controller;
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;}).catch(()=>{});});
  const checkUpdate=()=>{if(swReg)swReg.update().catch(()=>{});};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
  window.addEventListener('focus',checkUpdate); setInterval(checkUpdate,30*60*1000);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController){hadController=true;return;}            // first install: nothing to refresh
    const busy=Object.keys(pendingDocs||{}).length>0||document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(busy){setTimeout(()=>location.reload(),4000);} else location.reload();
  });
}

/* ================= navigation: all sections live on one page ================= */
let view={type:'home'};
async function loadWeek(st){
  weekStart=st; wk=dkey(st);
  state=await getWeek(wk);
  const pk=dkey(addDays(st,-7));
  prevState=cache[pk]||null;
  if(!prevState){store.load(pk).then(p=>{if(p){cache[pk]=normalize(p,pk);if(wk===dkey(st)){prevState=cache[pk];if(view.type==='week')renderReview(false);}}});}
}
function setHash(h){try{if(location.hash!==h)history.replaceState(null,'',h);}catch(e){}}
let shownHash='', navBack=false; const navHist=[];
function showView(which){
  const curType=shownHash.replace(/-.*$/,'');
  if(!navBack&&shownHash&&curType!==which){navHist.push(shownHash); if(navHist.length>30)navHist.shift();}
  navBack=false;
  for(const n of ['Home','Week','Day','Wishes','Settings','Style','Growth','Balance','Expenses','Admin'])$('#view'+n).hidden=(n.toLowerCase()!==which);
  if(which!=='day')$('#viewDay').dataset.k='';
  const bb=$('#backbar'); if(bb){bb.hidden=(which==='home'); $('#backLabel').textContent=which==='day'?T_("Назад к неделе"):T_("Назад");}
  const navKey=which==='day'||which==='growth'?'week':which==='style'?'home':which==='admin'?'settings':which;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===navKey));
  closeModal(); window.scrollTo({top:0,behavior:'auto'});
  shownHash=currentHash();
}
/* «Назад»: a day returns to its week; everything else returns to where it was opened from (home as a fallback) */
function goBack(){
  navBack=true;
  if(view.type==='day')return showWeek(mondayOf(parse(view.k)));
  let prev=navHist.pop(); while(prev&&prev===currentHash())prev=navHist.pop();
  const h='#'+(prev||'home'); if(location.hash===h){navBack=false;return route();} location.hash=h;
}
$('#backBtn').addEventListener('click',goBack);
async function showHome(){
  view={type:'home'}; const ck=curWeekKey(); if(!cache[ck])await getWeek(ck); if(view.type!=='home')return;
  if(!state){await loadWeek(mondayOf(new Date()));if(view.type!=='home')return;}
  showView('home'); renderHome(); setHash('#home');
}
async function showWeek(st){
  st=st||weekStart; view={type:'week'};
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='week')return;
  showView('week'); renderAll(); setHash('#week-'+wk);
  const tabs=$('#weekTabs'); tabs.innerHTML='<button type="button" class="on" data-v="week">'+T('tab_week')+'</button><button type="button" data-v="growth">'+T('tab_growth')+'</button>';
  tabs.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v==='growth')showGrowth();};
}
async function showDay(k){
  view={type:'day',k};
  const st=mondayOf(parse(k));
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='day'||view.k!==k)return;
  $('#range').innerHTML=rangeLabel(weekStart);
  $('#banner').hidden=!hasExamples(state);
  renderDayPage(k); showView('day'); fitAll($('#viewDay')); setHash('#day-'+k);
}
function showWishes(openId){view={type:'wishes'};showView('wishes');renderWishes();setHash('#wishes');const ns=notifState();if(Date.now()-(ns.lastWishVisit||0)>864e5){ns.lastWishVisit=Date.now();queueDoc('profile',P);}if(openId){const w=wishes.find(x=>x.id===openId);if(w)openWish(w);}}
function showSettings(){view={type:'settings'};showView('settings');renderSettings();setHash('#settings');}
function route(){
  const h=(location.hash||'').slice(1);
  let m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/); if(m)return showDay(m[1]);
  m=h.match(/^week-(\d{4}-\d{2}-\d{2})$/); if(m)return showWeek(mondayOf(parse(m[1])));
  if(h==='week')return showWeek(mondayOf(new Date()));
  m=h.match(/^wish-([A-Za-z0-9]+)$/); if(m)return showWishes(m[1]);
  if(h==='wishes')return showWishes();
  if(h==='settings')return showSettings();
  if(h==='style')return showStyle();
  if(h==='growth')return showGrowth();
  if(h==='admin')return showAdmin();
  if(h==='balance')return showBalance();
  if(h==='expenses')return showExpenses();
  if(h==='quiz'){return showHome().then(()=>runQuiz());}
  return showHome();
}
function currentHash(){return view.type==='day'?'day-'+view.k:view.type==='week'?'week-'+wk:view.type;}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==currentHash())route();});
$('#prev').addEventListener('click',()=>showWeek(addDays(weekStart,-7)));
$('#next').addEventListener('click',()=>showWeek(addDays(weekStart,7)));
$('#today').addEventListener('click',()=>showWeek(mondayOf(new Date())));
$('#clearEx').addEventListener('click',()=>{clearExamples();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalEl){closeModal();return;}if(view.type==='day'){showWeek(weekStart);return;}}
  if(e.target.matches('input,textarea,select'))return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const dir=e.key==='ArrowLeft'?-1:1;
  if(view.type==='day')showDay(dkey(addDays(parse(view.k),dir)));else if(view.type==='week')showWeek(addDays(weekStart,7*dir));
});

/* ================= boot ================= */
(async function boot(){
  if(SB_ON){
    await store.init();
    if(!sbUser){ applyTheme(); applyLang(); showAuth('login'); setStatus('',T_("Войди, чтобы начать")); return; }
    await migrateGuest();
    const p=await store.loadDoc('profile'); P=p?normProfile(p):defaultProfile();
    if(syncLang())return;
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    wishes=await store.listWishes();
    let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
    if(!wishes.length&&!seen&&!P.onboarded)wishes=sampleWishes();
    await route(); if(await relocalizeExamples())await route();
    $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
    $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
    if(!P.onboarded)showOnboarding();
    idleStatus(); trackActivity(); outbox.flush();
    return;
  }
  try{const r=localStorage.getItem('planner.profile');if(r)P=normProfile(JSON.parse(r));}catch(e){}
  applyTheme(); paintAvatar(); applyLang();
  try{const bg=await idb.get('bg');if(bg&&bg.img){BG=bg;applyTheme();}}catch(e){}
  wishes=await store.listWishes();
  let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
  if(!wishes.length&&!seen)wishes=sampleWishes();
  await route();                               // first paint from this browser
  $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
  $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
  if(!P.onboarded)showOnboarding();
  idleStatus();
  await store.init();
  if(store.mode==='db'){
    const p=await store.loadDoc('profile'); if(p){P=normProfile(p);}
    if(syncLang())return;
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    const ws=await store.listWishes(); if(ws.length||seen)wishes=ws;
    for(const k of Object.keys(cache))delete cache[k];   // reload from the account store
    wk=null; state=null; BAL=null; EXP=null; store.flushOutbox();
    await route(); if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} idleStatus(); paintBell(); notifTick(false);
    if(P.onboarded&&!$('#onbHost').querySelector('.quiz'))$('#onbHost').innerHTML='';
  } else { if(syncLang())return; if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} }
})();

})();
