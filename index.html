  days.forEach((d,i)=>{const x=6+i*(bw+gap);const h=(base-top)*(d.active||0)/max;const y=base-h;chart+='<g><title>'+d.day+': '+T_("активных")+' '+(d.active||0)+', '+T_("новых")+' '+(d.new_users||0)+'</title><rect class="track" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+(base-top)+'" rx="3"/>'+((d.active||0)>0?'<rect class="bar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3"/>':'')+(i%5===0?'<text class="wd" x="'+(x+bw/2)+'" y="'+(base+16)+'" text-anchor="middle">'+d.day.slice(5)+'</text>':'')+'</g>';});

    '<div class="gtiles">'+tile(s.total_users||0,T_("всего аккаунтов"))+tile(s.new_7d||0,T_("новых за 7 дней"))+tile(s.new_30d||0,T_("новых за 30 дней"))+tile(s.active_today||0,T_("активных сегодня"))+tile(s.active_7d||0,T_("активных за 7 дней"))+tile(s.active_30d||0,T_("активных за 30 дней"))+'</div>'+
    '<section class="sec"><div class="whead"><span class="label">'+T_("Активные по дням")+'</span><span class="fine">'+T_("последние 30 дней")+'</span></div><div class="chart gchart">'+chart+'</div></section>'+
    '<div class="wgrid"><section class="sec"><h3>'+T_("Путь пользователя")+'</h3><div class="arow"><span class="an">'+T_("Прошли знакомство")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.onboarded||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.onboarded||0)+'</span></div><div class="arow"><span class="an">'+T_("Прошли анкету")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.quiz_done||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.quiz_done||0)+'</span></div></section>'+
    '<section class="sec"><h3>'+T_("Устройства")+'</h3>'+(plat.length?plat.map(([k,n])=>'<div class="arow"><span class="an">'+esc(k)+'</span><div class="bar"><i style="width:'+Math.round(n/plat[0][1]*100)+'%"></i></div><span class="av">'+n+'</span></div>').join(''):'<div class="empty">'+T_("Пока нет данных.")+'</div>')+'</section></div>'+
    '<h2 style="margin:18px 0 10px">'+T_("Продажи")+'</h2><div class="gtiles" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+tile(s.paid||0,T_("купили навсегда"))+tile(s.paid_30d||0,T_("покупок за 30 дней"))+tile(Math.max(0,(s.total_users||0)-(s.paid||0)),T_("на пробном периоде или после него"))+tile(s.codes_free||0,T_("свободных кодов"))+'</div>'+
    '<div class="wgrid"><section class="sec" id="adSettings"><h3>'+T_("Настройки продаж")+'</h3><div class="empty">'+T_("Загружаю…")+'</div></section><section class="sec" id="adCodes"><h3>'+T_("Коды доступа")+'</h3><div class="empty">'+T_("Загружаю…")+'</div></section></div>';

let lastGen='';

  const sv=$('#adSettings'), cv=$('#adCodes'); if(!sv||!cv)return;
  let st=null, codes=null;
  try{ const r1=await sb.rpc('admin_settings'); if(r1.error)throw r1.error; st=(r1.data&&typeof r1.data==='object')?r1.data:{}; const r2=await sb.rpc('admin_codes'); if(r2.error)throw r2.error; codes=Array.isArray(r2.data)?r2.data:[]; }
  catch(e){ sv.querySelector('.empty').textContent=T_("Нужно выполнить")+' schema_v2.sql '+T_("в")+' Supabase: '+(e.message||e); cv.querySelector('.empty').textContent=''; return; }
  const F=(k,label,ph,hint)=>'<div class="frow"><label class="label" for="st_'+k+'">'+label+'</label><input type="text" id="st_'+k+'" value="'+esc(st[k]||'')+'" placeholder="'+ph+'">'+(hint?'<span class="fine">'+hint+'</span>':'')+'</div>';

    '<div><button class="pill primary" id="stSave">'+T_("Сохранить настройки")+'</button></div>';
  $('#stSave').addEventListener('click',async()=>{ const b=$('#stSave'); b.disabled=true; try{ for(const k of ['buy_url','price_text','trial_days','gumroad_product_id']){ const {error}=await sb.rpc('admin_set_setting',{k,v:$('#st_'+k).value.trim()}); if(error)throw error; } toast(T_("Сохранено")); }catch(e){ toast(T_("Не удалось:")+' '+(e.message||e)); } b.disabled=false; });
  const free=codes.filter(c=>!c.used&&c.note!=='gumroad');
  cv.innerHTML='<h3>'+T_("Коды доступа")+'</h3><p class="fine" style="margin:0">'+T_("Один код — один аккаунт навсегда. Отправляй код покупателю после оплаты (или выдавай как подарок).")+'</p>'+
    '<div class="frow2"><input class="em" id="genN" type="number" min="1" max="200" value="10" aria-label="'+T_("Сколько кодов")+'" style="width:72px"><input class="nm" id="genNote" placeholder="'+T_("заметка, например: октябрь, подарки")+'"><button class="pill primary" id="genGo">'+T_("Создать")+'</button></div>'+
    '<div id="genOut">'+(lastGen?'<div class="authmsg ok" style="white-space:pre-wrap;font-family:ui-monospace,monospace">'+esc(lastGen)+'</div><button class="pill" id="copyAll">'+T_("Скопировать все")+'</button>':'')+'</div>'+
    '<div class="codelist">'+(codes.length?codes.slice(0,100).map(c=>'<div class="crow2'+(c.used?' used':'')+'"><code>'+esc(c.code)+'</code><span class="fine">'+(c.used?T_("использован")+' '+new Date(c.used_at).toLocaleDateString():T_("свободен"))+(c.note?' · '+esc(c.note):'')+'</span>'+(c.used?'':'<button class="iconbtn" data-copy="'+esc(c.code)+'" aria-label="'+T_("Скопировать")+'">⧉</button>')+'</div>').join(''):'<div class="empty">'+T_("Кодов пока нет — создай первые.")+'</div>')+'</div>';
  $('#genGo').addEventListener('click',async()=>{ const n=Math.max(1,Math.min(200,+$('#genN').value||1)); const b=$('#genGo'); b.disabled=true; try{ const {data,error}=await sb.rpc('admin_generate_codes',{n,p_note:$('#genNote').value.trim()||null}); if(error)throw error; lastGen=(data||[]).join('\n'); renderAdmin(); }catch(e){ toast(T_("Не удалось:")+' '+(e.message||e)); } b.disabled=false; });
  cv.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);toast(T_("Скопировано:")+' '+b.dataset.copy);}));
  const ca=$('#copyAll'); if(ca)ca.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(lastGen);toast(T_("Скопировано"));});

function showAdmin(){view={type:'admin'};showView('admin');renderAdmin();setHash('#admin');}

/* ---- install prompt (Android shows a button; iPhone gets a one-line hint) ---- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#installBtn');if(b)b.hidden=false;});
function installHint(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; if(standalone)return '';
  if(installEvt)return '<button class="pill primary" id="installBtn">'+T_("Установить приложение")+'</button>';
  if(/iPhone|iPad/.test(navigator.userAgent))return '<span class="fine">'+T_("Чтобы поставить иконку на экран: Поделиться")+' <span style="font-size:15px">⎙</span> → '+T_("«На экран Домой».")+'</span>';
  return '<span class="fine">'+T_("В меню браузера выбери «Установить приложение» или «Добавить на главный экран».")+'</span>';
}
document.addEventListener('click',e=>{const b=e.target.closest('#installBtn');if(!b||!installEvt)return;installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;b.hidden=true;});});
/* updates: a new build is picked up when the app is opened or brought back to the foreground; the page reloads once the new version is in control */
if('serviceWorker' in navigator){
  let swReg=null, hadController=!!navigator.serviceWorker.controller;
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;}).catch(()=>{});});
  const checkUpdate=()=>{if(swReg)swReg.update().catch(()=>{});};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
  window.addEventListener('focus',checkUpdate); setInterval(checkUpdate,30*60*1000);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController){hadController=true;return;}            // first install: nothing to refresh
    const busy=Object.keys(pendingDocs||{}).length>0||document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(busy){setTimeout(()=>location.reload(),4000);} else location.reload();
  });
}

/* ================= navigation: all sections live on one page ================= */
let view={type:'home'};
async function loadWeek(st){
  weekStart=st; wk=dkey(st);
  state=await getWeek(wk);
  const pk=dkey(addDays(st,-7));
  prevState=cache[pk]||null;
  if(!prevState){store.load(pk).then(p=>{if(p){cache[pk]=normalize(p,pk);if(wk===dkey(st)){prevState=cache[pk];if(view.type==='week')renderReview(false);}}});}
}
function setHash(h){try{if(location.hash!==h)history.replaceState(null,'',h);}catch(e){}}
let shownHash='', navBack=false; const navHist=[];
function showView(which){
  const curType=shownHash.replace(/-.*$/,'');
  if(!navBack&&shownHash&&curType!==which){navHist.push(shownHash); if(navHist.length>30)navHist.shift();}
  navBack=false;
  for(const n of ['Home','Week','Day','Wishes','Settings','Style','Growth','Balance','Expenses','Admin'])$('#view'+n).hidden=(n.toLowerCase()!==which);
  if(which!=='day')$('#viewDay').dataset.k='';
  const bb=$('#backbar'); if(bb){bb.hidden=(which==='home'); $('#backLabel').textContent=which==='day'?T_("Назад к неделе"):T_("Назад");}
  const navKey=which==='day'||which==='growth'?'week':which==='style'?'home':which==='admin'?'settings':which;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===navKey));
  closeModal(); window.scrollTo({top:0,behavior:'auto'});
  shownHash=currentHash();
}
/* «Назад»: a day returns to its week; everything else returns to where it was opened from (home as a fallback) */
function goBack(){
  navBack=true;
  if(view.type==='day')return showWeek(mondayOf(parse(view.k)));
  let prev=navHist.pop(); while(prev&&prev===currentHash())prev=navHist.pop();
  const h='#'+(prev||'home'); if(location.hash===h){navBack=false;return route();} location.hash=h;
}
$('#backBtn').addEventListener('click',goBack);
async function showHome(){
  view={type:'home'}; const ck=curWeekKey(); if(!cache[ck])await getWeek(ck); if(view.type!=='home')return;
  if(!state){await loadWeek(mondayOf(new Date()));if(view.type!=='home')return;}
  showView('home'); renderHome(); setHash('#home');
}
async function showWeek(st){
  st=st||weekStart; view={type:'week'};
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='week')return;
  showView('week'); renderAll(); setHash('#week-'+wk);
  const tabs=$('#weekTabs'); tabs.innerHTML='<button type="button" class="on" data-v="week">'+T('tab_week')+'</button><button type="button" data-v="growth">'+T('tab_growth')+'</button>';
  tabs.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v==='growth')showGrowth();};
}
async function showDay(k){
  view={type:'day',k};
  const st=mondayOf(parse(k));
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='day'||view.k!==k)return;
  $('#range').innerHTML=rangeLabel(weekStart);
  $('#banner').hidden=!hasExamples(state);
  renderDayPage(k); showView('day'); fitAll($('#viewDay')); setHash('#day-'+k);
}
function showWishes(openId){view={type:'wishes'};showView('wishes');renderWishes();setHash('#wishes');const ns=notifState();if(Date.now()-(ns.lastWishVisit||0)>864e5){ns.lastWishVisit=Date.now();queueDoc('profile',P);}if(openId){const w=wishes.find(x=>x.id===openId);if(w)openWish(w);}}
function showSettings(){view={type:'settings'};showView('settings');renderSettings();setHash('#settings');}
function route(){
  const h=(location.hash||'').slice(1);
  let m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/); if(m)return showDay(m[1]);
  m=h.match(/^week-(\d{4}-\d{2}-\d{2})$/); if(m)return showWeek(mondayOf(parse(m[1])));
  if(h==='week')return showWeek(mondayOf(new Date()));
  m=h.match(/^wish-([A-Za-z0-9]+)$/); if(m)return showWishes(m[1]);
  if(h==='wishes')return showWishes();
  if(h==='settings')return showSettings();
  if(h==='style')return showStyle();
  if(h==='growth')return showGrowth();
  if(h==='admin')return showAdmin();
  if(h==='balance')return showBalance();
  if(h==='expenses')return showExpenses();
  if(h==='quiz'){return showHome().then(()=>runQuiz());}
  return showHome();
}
function currentHash(){return view.type==='day'?'day-'+view.k:view.type==='week'?'week-'+wk:view.type;}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==currentHash())route();});
$('#prev').addEventListener('click',()=>showWeek(addDays(weekStart,-7)));
$('#next').addEventListener('click',()=>showWeek(addDays(weekStart,7)));
$('#today').addEventListener('click',()=>showWeek(mondayOf(new Date())));
$('#clearEx').addEventListener('click',()=>{clearExamples();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalEl){closeModal();return;}if(view.type==='day'){showWeek(weekStart);return;}}
  if(e.target.matches('input,textarea,select'))return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const dir=e.key==='ArrowLeft'?-1:1;
  if(view.type==='day')showDay(dkey(addDays(parse(view.k),dir)));else if(view.type==='week')showWeek(addDays(weekStart,7*dir));
});

/* ================= boot ================= */
(async function boot(){
  if(SB_ON){
    await store.init();
    if(!sbUser){ applyTheme(); applyLang(); showAuth('login'); setStatus('',T_("Войди, чтобы начать")); return; }
    await migrateGuest();
    const p=await store.loadDoc('profile'); P=p?normProfile(p):defaultProfile();
    if(syncLang())return;
    await loadAccess();
    if(accessState().state==='expired'){ applyTheme(); paintAvatar(); applyLang(); trackActivity(); showPaywall(); return; }
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    wishes=await store.listWishes();
    let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
    if(!wishes.length&&!seen&&!P.onboarded)wishes=sampleWishes();
    await route(); if(await relocalizeExamples())await route();
    $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
    $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
    if(!P.onboarded)showOnboarding();
    trialBanner();
    idleStatus(); trackActivity(); outbox.flush();
    return;
  }
  try{const r=localStorage.getItem('planner.profile');if(r)P=normProfile(JSON.parse(r));}catch(e){}
  applyTheme(); paintAvatar(); applyLang();
  try{const bg=await idb.get('bg');if(bg&&bg.img){BG=bg;applyTheme();}}catch(e){}
  wishes=await store.listWishes();
  let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
  if(!wishes.length&&!seen)wishes=sampleWishes();
  await route();                               // first paint from this browser
  $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
  $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
  if(!P.onboarded)showOnboarding();
  idleStatus();
  await store.init();
  if(store.mode==='db'){
    const p=await store.loadDoc('profile'); if(p){P=normProfile(p);}
    if(syncLang())return;
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    const ws=await store.listWishes(); if(ws.length||seen)wishes=ws;
    for(const k of Object.keys(cache))delete cache[k];   // reload from the account store
    wk=null; state=null; BAL=null; EXP=null; store.flushOutbox();
    await route(); if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} idleStatus(); paintBell(); notifTick(false);
    if(P.onboarded&&!$('#onbHost').querySelector('.quiz'))$('#onbHost').innerHTML='';
  } else { if(syncLang())return; if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} }
})();

})();
