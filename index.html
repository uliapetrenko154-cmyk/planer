      '<div class="opts">'+q.o.map((o,k)=>'<button type="button" class="opt'+(cur.includes(k)?' on':'')+'" data-k="'+k+'" aria-pressed="'+cur.includes(k)+'"><span class="tick"></span>'+o+'</button>').join('')+'</div>'+
      '<span class="hint2">'+(q.exclusive!=null?T_("Можно выбрать несколько — кроме «Предпочитаю не отвечать», он только отдельно"):T_("Можно выбрать один или несколько вариантов"))+'</span>'+
      '<div class="sfoot" style="padding:0"><button class="pill" id="qBack">'+(i===0?T_("Выйти"):T_("Назад"))+'</button><span class="grow"></span><button class="pill" id="qSkip">'+T_("Пропустить")+'</button><button class="pill primary" id="qNext">'+(i===total-1?T_("Показать профиль"):T_("Далее"))+'</button></div></div></div>';
    const bar=host.querySelector('.qprog i'); requestAnimationFrame(()=>{bar.style.width=(answeredCount()*12.5)+'%';});
    host.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k; let s=sel(q.id).slice();
      if(q.exclusive!=null&&k===q.exclusive){s=s.includes(k)?[]:[k];}
      else{ if(q.exclusive!=null)s=s.filter(x=>x!==q.exclusive); const j=s.indexOf(k); if(j>-1)s.splice(j,1); else s.push(k); }
      A[q.id]=s; queueDoc('profile',P);
      host.querySelectorAll('.opt').forEach(x=>{const on=s.includes(+x.dataset.k);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
      const nn=answeredCount(); host.querySelector('.qprog i').style.width=(nn*12.5)+'%'; host.querySelector('.qmeta span').textContent=nn+' '+T_("из")+' '+total+' '+T_("отвечено"); host.querySelector('.qpct').textContent=fmtPct(nn);
    }));
    const go=d=>{queueDoc('profile',P);if(i+d<0){exit();return;}if(i+d>=total){done();return;}i+=d;render(d>0?'fwd':'back');};
    $('#qNext').addEventListener('click',()=>go(1));
    $('#qSkip').addEventListener('click',()=>{A[q.id]=[];go(1);});
    $('#qBack').addEventListener('click',()=>go(-1));
    host.querySelector('.onb').addEventListener('keydown',e=>{if(e.key==='Escape')exit();if(e.key==='Enter')go(1);});
    host.querySelector('.qcard').setAttribute('tabindex','-1'); host.querySelector('.qcard').focus({preventScroll:true});
  }
  function exit(){queueDoc('profile',P);host.innerHTML='';renderHome();}
  function done(){finishQuiz();host.innerHTML='';showStyle();toast(phrase('{n}, '+T_("готово ✨ Вот твой профиль предпочтений.")));}
  render('fwd');
}

async function notifTick(force){
  const nf=NF(); if(!nf.on||!P.onboarded)return;
  const st=notifState(); const quiet=inQuiet(); const tone=toneKey(); const cap=capFor();
  const cw=cache[curWeekKey()]||await getWeek(curWeekKey()); const td=cw.days[todayKey]||{tasks:[]};
  const optionalCount=()=>st.keys.filter(k=>!k.startsWith('task-')&&!k.startsWith('step-')).length;
  const recent=t=>{const m=minutesSince(t);return m>=0&&m<=12;};
  const tryOpt=(key,text,link,fresh)=>{if(st.keys.includes(key))return;if(quiet)return;if(optionalCount()>=cap)return;deliver(key,text,link,{silent:!fresh});};
  // morning / day / evening

    if(minutesSince(nf.morning)>=0)tryOpt('morning',phrase(pick(NT.morning[tone],'nm')),'#day-'+todayKey,recent(nf.morning)||force);
    if(nf.dayOn&&minutesSince(nf.day)>=0&&td.tasks.some(t=>!t.done))tryOpt('day',phrase(pick(NT.day[tone],'nd')),'#day-'+todayKey,recent(nf.day)||force);
    if(minutesSince(nf.evening)>=0&&td.tasks.length)tryOpt('evening',phrase(pick(NT.evening[tone],'ne')),'#week-'+curWeekKey(),recent(nf.evening)||force);
    if(nf.motiv&&minutesSince('15:00')>=0)tryOpt('motiv',phrase(pick(motivPool(),'m50')),'',recent('15:00')||force);
    if(nf.wishes&&wishes.length&&Date.now()-(st.lastWishVisit||0)>7*864e5)tryOpt('wish',phrase(pick(NT.wish,'nw')),'#wishes',force);
  }

  if(nf.taskTimes&&!quiet){for(const t of td.tasks){if(t.done)continue;const tm=timeInText(t.t);if(tm==null)continue;const diff=tm-nowMin();if(diff<=10&&diff>-45){deliver('task-'+t.id,phrase(pick(NT.task,'nt')).replace('{t}',String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0')).replace('{task}',t.t),'#day-'+todayKey);}}}
  // goals: steps due today / in a few days
  if(nf.goals&&!quiet){
    const fromMorning=minutesSince(nf.morning)>=0;
    for(const w of wishes){ if(!w.isGoal||w.done)continue;
      for(const s of w.steps){ if(s.done||!s.date)continue;
        const d=Math.round((parse(s.date)-parse(todayKey))/864e5);
        if(d===0&&fromMorning)deliver('step-'+s.id,phrase(NT.goal[1]).replace('{g}',w.title).replace('{s}',s.t),'#day-'+s.date,{silent:!force&&!recent(nf.morning)});
        else if((d===1||d===3||d===7)&&fromMorning)tryOpt('goalsoon-'+s.id,phrase(NT.goal[2]).replace('{g}',w.title).replace('{s}',s.t).replace('{d}',d).replace(T_("{дн}"),pluralDays(d)),'#wish-'+w.id,false);
      }

    }
  }
}

function balSummary(e){
  if(!balFilled(e))return null;
  const list=AREAS.map(a=>({a,v:balScore(e,a.id)})).sort((x,y)=>x.v-y.v);
  const low=list.filter(x=>x.v<=5).slice(0,3); const lows=low.length?low:list.slice(0,2);
  const high=list.slice().reverse().filter(x=>x.v>=7).slice(0,3); const highs=high.length?high:list.slice(-2).reverse();
  const spread=list[list.length-1].v-list[0].v;
  const shape=spread<=2?T_("Колесо ровное — сферы в балансе, его легко «катить»."):spread<=4?T_("Есть перекос: несколько сфер заметно отстают и тянут остальные."):T_("Сильный перекос: колесо «не катится» — одна-две сферы сильно просели.");
  return {avg:balAvg(e),lows,highs,spread,shape};
}

/* steps <-> calendar tasks */
async function weekFor(k){return getWeek(dkey(mondayOf(parse(k))));}
function refreshIfVisible(k){const wkk=dkey(mondayOf(parse(k)));if(wkk===wk){if(view.type==='day'&&view.k===k)renderDayPage(k);afterChange();}renderHome();}
async function stepAddTask(w,st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;if(!d.tasks.some(t=>t.id===st.id))d.tasks.push({id:st.id,t:st.t,done:st.done,pri:true,wish:w.id});save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}
async function stepSetDone(w,st,done){st.done=done;st.doneAt=done?Date.now():0;saveWish(w);if(done)goalProgressNotify(w);if(st.date){const wobj=await weekFor(st.date);const d=wobj.days[st.date];const t=d&&d.tasks.find(x=>x.id===st.id);if(t){t.done=done;save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}renderWishes();renderHome();}
async function unlinkStepTask(st){const wobj=await weekFor(st.date);const d=wobj.days[st.date];if(!d)return;const i=d.tasks.findIndex(x=>x.id===st.id);if(i>-1){d.tasks.splice(i,1);save(dkey(mondayOf(parse(st.date))));refreshIfVisible(st.date);}}
async function stepRemove(w,st){w.steps=w.steps.filter(x=>x!==st);saveWish(w);if(st.date)await unlinkStepTask(st);renderWishes();renderHome();}
function taskWishSync(t,ch){const w=wishes.find(x=>x.id===t.wish);if(!w)return;const st=w.steps.find(s=>s.id===t.id);if(!st)return;if(ch.removed){w.steps=w.steps.filter(s=>s!==st);}else{if(ch.done!=null){st.done=ch.done;st.doneAt=ch.done?Date.now():0;}if(ch.text!=null)st.t=ch.text;if(ch.date!=null)st.date=ch.date;}saveWish(w);if(ch.done)goalProgressNotify(w);renderHome();}

/* examples follow the interface language: after a language switch they are regenerated once (user's own items stay) */
async function relocalizeExamples(){
  let flag=false; try{flag=localStorage.getItem('planner.relocEx')==='1'; if(flag)localStorage.removeItem('planner.relocEx');}catch(e){}
  if(!flag)return false;
  /*i18n-off*/
  const anyL=ru=>[ru,(I18N.uk||{})[ru],(I18N.en||{})[ru]].filter(Boolean);
  const NOTES=[...anyL('После 18:00 уже не было сил на чтение'),...anyL('Проект уехал на понедельник')];
  const EXN=anyL('Все приоритеты по работе закрыты до четверга');
  const DEF_RU={home:'Мой дом',travel:'Путешествия',career:'Карьера',buy:'Покупки'};
  /*i18n-on*/
  let changed=false;
  const wkey=wk||dkey(mondayOf(new Date())); const cur=await getWeek(wkey);
  if(cur&&hasExamples(cur)){
    const fresh=sampleWeek(wkey); const fks=Object.keys(fresh.days);
    Object.keys(cur.days).forEach((k,i)=>{const d=cur.days[k], f=fresh.days[fks[i]]; if(!d||!f)return;
      const own=d.tasks.filter(t=>!t.ex); if(own.length!==d.tasks.length)d.tasks=f.tasks.concat(own);
      if(NOTES.includes(d.note))d.note=f.note||'';});
    const ownG=cur.goals.filter(g=>!g.ex); if(ownG.length!==cur.goals.length)cur.goals=fresh.goals.concat(ownG);
    if(EXN.includes(cur.review.good))cur.review.good=EX_NOTE;
    save(wkey); changed=true;
  }
  if(wishes.some(w=>w.ex)){
    const old=wishes.filter(w=>w.ex); const keep=wishes.filter(w=>!w.ex);
    for(const w of old){delete pendingDocs['wish-'+w.id]; try{await store.deleteDoc('wish-'+w.id);}catch(e){}}
    wishes=sampleWishes().concat(keep); persistSampleWishes(); changed=true;
  }
  let pf=false; (P.folders||[]).forEach(f=>{const ru=DEF_RU[f.id]; if(ru&&anyL(ru).includes(f.name)&&f.name!==T_(ru)){f.name=T_(ru);pf=true;}});
  if(pf){saveProfile();changed=true;}
  return changed;
}

}


/* ================= standalone app: accounts (Supabase), offline mirror, anonymous usage stats, admin page ================= */
const CFG=window.PLANER_CONFIG||{};
const SB_ON=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let sb=null, sbUser=null;
const guestKeys=()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('planner.')&&!k.startsWith('planner.u.'));}catch(e){return [];}};
/* local mirror keyed by account, so several people on one device never see each other's data */
const mirror={
  key(id){return 'planner.u.'+(sbUser?sbUser.id.slice(0,8):'guest')+'.'+id;},
  async get(id){ if(isLS(id)){try{const r=localStorage.getItem(this.key(id));return r?JSON.parse(r):null;}catch(e){return null;}} return idb.get(this.key(id)); },
  async set(id,body){ if(isLS(id)){localStorage.setItem(this.key(id),JSON.stringify(body));} else await idb.set(this.key(id),body); },
  async del(id){ try{ if(isLS(id))localStorage.removeItem(this.key(id)); else await idb.del(this.key(id)); }catch(e){} },
  async wishes(){ const all=await idb.all(); const pre=this.key('wish-'); return Object.entries(all).filter(([k])=>k.startsWith(pre)).map(([,v])=>v); },
};
const outbox={
  async add(id,body){ try{const o=(await idb.get('outbox'))||{}; o[id]=body===null?null:body; await idb.set('outbox',o);}catch(e){} },
  async flush(){ if(!sb||!sbUser||!navigator.onLine)return; let o={}; try{o=(await idb.get('outbox'))||{};}catch(e){return;} const ids=Object.keys(o); if(!ids.length)return;
    for(const id of ids){ try{ if(o[id]===null){await sb.from('docs').delete().eq('id',id);} else {await sb.from('docs').upsert({user_id:sbUser.id,id,data:o[id],updated_at:new Date().toISOString()});} delete o[id]; }catch(e){ break; } }
    try{await idb.set('outbox',o);}catch(e){} if(!Object.keys(o).length)setStatus('',T_("Синхронизировано")); }
};
const cloud={
  async loadDoc(id){
    if(navigator.onLine){ try{ const {data,error}=await sb.from('docs').select('data').eq('id',id).maybeSingle(); if(!error){ if(data){await mirror.set(id,data.data);return clone(data.data);} return null; } }catch(e){} }
    return mirror.get(id);
  },
  async writeDoc(id,data){
    const body=clone(data); await mirror.set(id,body);
    try{ if(!navigator.onLine)throw new Error('offline'); const {error}=await sb.from('docs').upsert({user_id:sbUser.id,id,data:body,updated_at:new Date().toISOString()}); if(error)throw error; }
    catch(e){ await outbox.add(id,body); setStatus('',T_("Сохранено офлайн — отправлю, когда появится сеть")); throw Object.assign(new Error('queued'),{queued:true}); }
  },
  async deleteDoc(id){ await mirror.del(id); try{ if(!navigator.onLine)throw new Error('offline'); await sb.from('docs').delete().eq('id',id); }catch(e){ await outbox.add(id,null); } },
  async listWishes(){
    if(navigator.onLine){ try{ const {data,error}=await sb.from('docs').select('data').like('id','wish-%'); if(!error&&data){ const arr=data.map(r=>r.data); for(const w of arr)await mirror.set('wish-'+w.id,w); return arr; } }catch(e){} }
    return mirror.wishes();
  },
};
/* hook the cloud layer into the existing store (keeps the Claude-artifact mode untouched) */
const _storeInit=store.init.bind(store);
store.init=async function(){
  if(!SB_ON){ return _storeInit(); }
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession(); sbUser=data&&data.session?data.session.user:null;
  if(sbUser){ this.mode='supabase'; this.uid=sbUser.id; }
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session?session.user:null; if((u&&u.id)!==(sbUser&&sbUser.id)){ sbUser=u; if(u){ location.reload(); } else { location.reload(); } } if(ev==='PASSWORD_RECOVERY')showPasswordReset(); });
};
const _loadDoc=store.loadDoc.bind(store), _writeDoc=store.writeDoc.bind(store), _deleteDoc=store.deleteDoc.bind(store), _listWishes=store.listWishes.bind(store);
store.loadDoc=function(id){return this.mode==='supabase'?cloud.loadDoc(id):_loadDoc(id);};
store.writeDoc=async function(id,data){ if(this.mode!=='supabase')return _writeDoc(id,data); try{await cloud.writeDoc(id,data);}catch(e){ if(!e.queued)throw e; setTimeout(()=>setStatus('',T_("Сохранено офлайн — отправлю, когда появится сеть")),0); } };
store.deleteDoc=function(id){return this.mode==='supabase'?cloud.deleteDoc(id):_deleteDoc(id);};
store.listWishes=function(){return this.mode==='supabase'?cloud.listWishes():_listWishes();};
const _idle=idleStatus; idleStatus=function(){ if(store.mode==='supabase')setStatus('',navigator.onLine?T_("Синхронизируется с аккаунтом"):T_("Офлайн — изменения сохранятся")); else _idle(); };
window.addEventListener('online',()=>{outbox.flush();idleStatus();}); window.addEventListener('offline',idleStatus);

async function migrateGuest(){
  if(store.mode!=='supabase')return;
  const flag='planner.u.'+sbUser.id.slice(0,8)+'.migrated'; try{if(localStorage.getItem(flag))return;}catch(e){}
  const hasCloudProfile=!!(await cloud.loadDoc('profile'));
  if(!hasCloudProfile){
    for(const k of guestKeys()){ const id=k.slice('planner.'.length); if(id==='seen')continue; try{ const body=JSON.parse(localStorage.getItem(k)); if(body&&typeof body==='object')await cloud.writeDoc(id,body).catch(()=>{}); }catch(e){} }
    try{ const all=await idb.all(); for(const [k,v] of Object.entries(all)){ if((k.startsWith('wish-')||k==='bg')&&v&&typeof v==='object')await cloud.writeDoc(k,v).catch(()=>{}); } }catch(e){}
  }
  try{localStorage.setItem(flag,'1');}catch(e){}
}

  if(store.mode!=='supabase'||!navigator.onLine)return;
  const day=todayKey; const flag='planner.u.'+sbUser.id.slice(0,8)+'.act'; let last=''; try{last=localStorage.getItem(flag)||'';}catch(e){}
  try{
    await sb.from('app_users').upsert({user_id:sbUser.id,last_active_at:new Date().toISOString(),onboarded:!!P.onboarded,quiz_done:!!(P.quiz&&P.quiz.done),lang:S().lang||'ru',platform:platformName()});
    if(last!==day){ await sb.from('activity').upsert({user_id:sbUser.id,day}); try{localStorage.setItem(flag,day);}catch(e){} }
  }catch(e){}
}
setInterval(trackActivity,10*60*1000);

/* ---- sign in / sign up screens ---- */
function authHtml(mode){
  const tab=(m,l)=>'<button type="button" class="'+(mode===m?'on':'')+'" data-m="'+m+'">'+l+'</button>';
  return '<div class="onb auth"><div class="card2"><div class="authlogo"><img src="./icons/icon-192.png" alt="" width="56" height="56"><div><h2>'+T_("Планер")+'</h2><p>'+T_("Неделя, цели, карта желаний и твой рост — в одном месте.")+'</p></div></div>'+
    (mode==='reset'?'<h3 style="margin:0">'+T_("Восстановление пароля")+'</h3><p>'+T_("Укажи")+' e-mail — '+T_("пришлём ссылку для нового пароля.")+'</p>':'<div class="seg" id="authTabs">'+tab('login',T_("Вход"))+tab('signup',T_("Регистрация"))+'</div>')+
    '<form id="authForm" autocomplete="on"><div class="frow"><label class="label" for="aEmail">E-mail</label><input type="email" id="aEmail" required autocomplete="email" placeholder="you@example.com"></div>'+
    (mode==='reset'?'':'<div class="frow"><label class="label" for="aPass">'+T_("Пароль")+'</label><input type="password" id="aPass" required minlength="6" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" placeholder="'+T_("не короче 6 символов")+'"></div>')+
    '<div class="authmsg" id="authMsg" hidden></div>'+
    '<div class="sfoot" style="padding:0;margin-top:4px">'+(mode==='login'?'<button type="button" class="linkbtn" id="aForgot">'+T_("Забыла пароль?")+'</button>':mode==='reset'?'<button type="button" class="linkbtn" id="aBack">← '+T_("Ко входу")+'</button>':'')+'<span class="grow"></span><button class="pill primary" type="submit" id="aSubmit">'+(mode==='login'?T_("Войти"):mode==='signup'?T_("Создать аккаунт"):T_("Отправить ссылку"))+'</button></div></form>'+
    '<p class="fine" style="margin:0">'+(mode==='signup'?T_("Регистрируясь, ты получаешь личное пространство: задачи, мечты и ответы анкеты видишь только ты. Для статистики приложения считается лишь факт использования — без содержимого."):T_("Данные хранятся в твоём аккаунте и доступны с любого устройства."))+'</p>'+
    '<div class="authlang" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+[['ru',T_("Русский")],['uk',T_("Українська")],['en','English']].map(([k,n])=>'<button type="button" class="pill'+(k===LANG?' primary':'')+'" data-lang="'+k+'" style="font-size:12px;padding:4px 10px">'+n+'</button>').join('')+'</div></div></div>';
}
function showAuth(mode){
  const host=$('#onbHost'); host.innerHTML=authHtml(mode||'login');
  const tabs=$('#authTabs'); if(tabs)tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)showAuth(b.dataset.m);});
  const msg=(t,ok)=>{const m=$('#authMsg');m.hidden=false;m.textContent=t;m.className='authmsg'+(ok?' ok':'');};
  const forgot=$('#aForgot'); if(forgot)forgot.addEventListener('click',()=>showAuth('reset'));
  const back=$('#aBack'); if(back)back.addEventListener('click',()=>showAuth('login'));
  host.querySelectorAll('.authlang button').forEach(b=>b.addEventListener('click',()=>{const l=b.dataset.lang; if(l===LANG)return; try{localStorage.setItem('planner.lang',l);}catch(e){} location.reload();}));
  $('#authForm').addEventListener('submit',async e=>{
    e.preventDefault(); const email=$('#aEmail').value.trim(); const pass=$('#aPass')?$('#aPass').value:''; const btn=$('#aSubmit'); btn.disabled=true;
    try{
      if(mode==='signup'){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}}); if(error)throw error;
        if(data.session){ /* confirmation disabled: signed in right away */ } else msg(T_("Почти готово: мы отправили письмо на")+' '+email+'. '+T_("Открой ссылку из него — и можно входить."),true); }
      else if(mode==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error)throw error; msg(T_("Если такой аккаунт есть, письмо со ссылкой уже в пути."),true); }
      else { const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error)throw error; }
    }catch(err){ msg(authError(err)); }
    btn.disabled=false;
  });
  setTimeout(()=>{const f=$('#aEmail');if(f)f.focus();},60);
}
function authError(err){const m=(err&&err.message)||'';if(/Invalid login credentials/i.test(m))return T_("Неверный")+' e-mail '+T_("или пароль.");if(/already registered|already exists/i.test(m))return T_("Такой")+' e-mail '+T_("уже зарегистрирован — попробуй войти.");if(/Email not confirmed/i.test(m))return 'E-mail '+T_("ещё не подтверждён — открой письмо и перейди по ссылке.");if(/Password should be/i.test(m))return T_("Пароль слишком короткий — минимум 6 символов.");if(/rate limit|too many/i.test(m))return T_("Слишком много попыток — подожди минуту.");if(/network|fetch/i.test(m))return T_("Нет связи с сервером. Проверь интернет.");return T_("Не получилось:")+' '+(m||T_("попробуй ещё раз"));}
function showPasswordReset(){
  const host=$('#onbHost'); host.innerHTML='<div class="onb auth"><div class="card2"><h2>'+T_("Новый пароль")+'</h2><form id="pwForm"><div class="frow"><label class="label" for="npw">'+T_("Пароль")+'</label><input type="password" id="npw" minlength="6" required autocomplete="new-password"></div><div class="authmsg" id="authMsg" hidden></div><div class="sfoot" style="padding:0"><span class="grow"></span><button class="pill primary" type="submit">'+T_("Сохранить")+'</button></div></form></div></div>';
  $('#pwForm').addEventListener('submit',async e=>{e.preventDefault();try{const {error}=await sb.auth.updateUser({password:$('#npw').value});if(error)throw error;host.innerHTML='';toast(T_("Пароль обновлён"));}catch(err){const m=$('#authMsg');m.hidden=false;m.textContent=authError(err);}});
}
async function signOut(){ if(sb){await sb.auth.signOut();} }

/* ---- owner-only usage page: counts and dates only ---- */
function isAdmin(){return !!(sbUser&&CFG.ADMIN_EMAIL&&sbUser.email&&sbUser.email.toLowerCase()===String(CFG.ADMIN_EMAIL).toLowerCase());}
async function renderAdmin(){
  const v=$('#viewAdmin'); if(v.hidden)return;
  if(!isAdmin()){v.innerHTML='<div class="sec"><p style="margin:0">'+T_("Эта страница доступна только владельцу приложения.")+'</p></div>';return;}
  v.innerHTML='<div class="growhead"><div><h2>'+T_("Статистика приложения")+'</h2><div class="tag">'+T_("Только обезличенные счётчики: сколько людей зарегистрировалось и как часто пользуются. Без имён, задач и ответов.")+'</div></div><button class="pill" id="adRefresh">'+T_("Обновить")+'</button></div><div class="empty">'+T_("Считаю…")+'</div>';
  $('#adRefresh').addEventListener('click',renderAdmin);
  let s=null; try{const {data,error}=await sb.rpc('admin_stats');if(error)throw error;s=data;}catch(e){v.querySelector('.empty').textContent=T_("Не удалось получить статистику:")+' '+(e.message||e)+'. '+T_("Проверь, что")+' SQL-'+T_("схема выполнена и")+' e-mail '+T_("владельца совпадает с")+' ADMIN_EMAIL.';return;}
  const tile=(val,label)=>'<div class="gtile"><div class="v">'+val+'</div><div class="k">'+label+'</div></div>';
  const days=(s.by_day||[]); const max=Math.max(1,...days.map(d=>Math.max(d.active||0,d.new_users||0)));
  const W=560,H=150,top=16,base=118,n=days.length,gap=3,bw=n?Math.max(3,(W-12-gap*(n-1))/n):10;
  let chart='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T_("Активные пользователи по дням")+'">';
  days.forEach((d,i)=>{const x=6+i*(bw+gap);const h=(base-top)*(d.active||0)/max;const y=base-h;chart+='<g><title>'+d.day+': '+T_("активных")+' '+(d.active||0)+', '+T_("новых")+' '+(d.new_users||0)+'</title><rect class="track" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+(base-top)+'" rx="3"/>'+((d.active||0)>0?'<rect class="bar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3"/>':'')+(i%5===0?'<text class="wd" x="'+(x+bw/2)+'" y="'+(base+16)+'" text-anchor="middle">'+d.day.slice(5)+'</text>':'')+'</g>';});
  chart+='</svg>';
  const plat=Object.entries(s.by_platform||{}).sort((a,b)=>b[1]-a[1]);
  v.innerHTML='<div class="growhead"><div><h2>'+T_("Статистика приложения")+'</h2><div class="tag">'+T_("Только обезличенные счётчики: сколько людей зарегистрировалось и как часто пользуются. Без имён, задач и ответов.")+'</div></div><button class="pill" id="adRefresh">'+T_("Обновить")+'</button></div>'+
    '<div class="gtiles">'+tile(s.total_users||0,T_("всего аккаунтов"))+tile(s.new_7d||0,T_("новых за 7 дней"))+tile(s.new_30d||0,T_("новых за 30 дней"))+tile(s.active_today||0,T_("активных сегодня"))+tile(s.active_7d||0,T_("активных за 7 дней"))+tile(s.active_30d||0,T_("активных за 30 дней"))+'</div>'+
    '<section class="sec"><div class="whead"><span class="label">'+T_("Активные по дням")+'</span><span class="fine">'+T_("последние 30 дней")+'</span></div><div class="chart gchart">'+chart+'</div></section>'+
    '<div class="wgrid"><section class="sec"><h3>'+T_("Путь пользователя")+'</h3><div class="arow"><span class="an">'+T_("Прошли знакомство")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.onboarded||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.onboarded||0)+'</span></div><div class="arow"><span class="an">'+T_("Прошли анкету")+'</span><div class="bar"><i style="width:'+(s.total_users?Math.round((s.quiz_done||0)/s.total_users*100):0)+'%"></i></div><span class="av">'+(s.quiz_done||0)+'</span></div></section>'+
    '<section class="sec"><h3>'+T_("Устройства")+'</h3>'+(plat.length?plat.map(([k,n])=>'<div class="arow"><span class="an">'+esc(k)+'</span><div class="bar"><i style="width:'+Math.round(n/plat[0][1]*100)+'%"></i></div><span class="av">'+n+'</span></div>').join(''):'<div class="empty">'+T_("Пока нет данных.")+'</div>')+'</section></div>';
  $('#adRefresh').addEventListener('click',renderAdmin);
}
function showAdmin(){view={type:'admin'};showView('admin');renderAdmin();setHash('#admin');}

/* ---- install prompt (Android shows a button; iPhone gets a one-line hint) ---- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#installBtn');if(b)b.hidden=false;});
function installHint(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; if(standalone)return '';
  if(installEvt)return '<button class="pill primary" id="installBtn">'+T_("Установить приложение")+'</button>';
  if(/iPhone|iPad/.test(navigator.userAgent))return '<span class="fine">'+T_("Чтобы поставить иконку на экран: Поделиться")+' <span style="font-size:15px">⎙</span> → '+T_("«На экран Домой».")+'</span>';
  return '<span class="fine">'+T_("В меню браузера выбери «Установить приложение» или «Добавить на главный экран».")+'</span>';
}
document.addEventListener('click',e=>{const b=e.target.closest('#installBtn');if(!b||!installEvt)return;installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;b.hidden=true;});});
/* updates: a new build is picked up when the app is opened or brought back to the foreground; the page reloads once the new version is in control */
if('serviceWorker' in navigator){
  let swReg=null, hadController=!!navigator.serviceWorker.controller;
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>{swReg=r;}).catch(()=>{});});
  const checkUpdate=()=>{if(swReg)swReg.update().catch(()=>{});};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
  window.addEventListener('focus',checkUpdate); setInterval(checkUpdate,30*60*1000);
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController){hadController=true;return;}            // first install: nothing to refresh
    const busy=Object.keys(pendingDocs||{}).length>0||document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(busy){setTimeout(()=>location.reload(),4000);} else location.reload();
  });
}

/* ================= navigation: all sections live on one page ================= */
let view={type:'home'};
async function loadWeek(st){
  weekStart=st; wk=dkey(st);
  state=await getWeek(wk);
  const pk=dkey(addDays(st,-7));
  prevState=cache[pk]||null;
  if(!prevState){store.load(pk).then(p=>{if(p){cache[pk]=normalize(p,pk);if(wk===dkey(st)){prevState=cache[pk];if(view.type==='week')renderReview(false);}}});}
}
function setHash(h){try{if(location.hash!==h)history.replaceState(null,'',h);}catch(e){}}
let shownHash='', navBack=false; const navHist=[];
function showView(which){
  const curType=shownHash.replace(/-.*$/,'');
  if(!navBack&&shownHash&&curType!==which){navHist.push(shownHash); if(navHist.length>30)navHist.shift();}
  navBack=false;
  for(const n of ['Home','Week','Day','Wishes','Settings','Style','Growth','Balance','Admin'])$('#view'+n).hidden=(n.toLowerCase()!==which);
  if(which!=='day')$('#viewDay').dataset.k='';
  const bb=$('#backbar'); if(bb){bb.hidden=(which==='home'); $('#backLabel').textContent=which==='day'?T_("Назад к неделе"):T_("Назад");}
  const navKey=which==='day'||which==='growth'?'week':which==='style'?'home':which==='admin'?'settings':which;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===navKey));
  closeModal(); window.scrollTo({top:0,behavior:'auto'});
  shownHash=currentHash();
}
/* «Назад»: a day returns to its week; everything else returns to where it was opened from (home as a fallback) */
function goBack(){
  navBack=true;
  if(view.type==='day')return showWeek(mondayOf(parse(view.k)));
  let prev=navHist.pop(); while(prev&&prev===currentHash())prev=navHist.pop();
  const h='#'+(prev||'home'); if(location.hash===h){navBack=false;return route();} location.hash=h;
}
$('#backBtn').addEventListener('click',goBack);
async function showHome(){
  view={type:'home'}; const ck=curWeekKey(); if(!cache[ck])await getWeek(ck); if(view.type!=='home')return;
  if(!state){await loadWeek(mondayOf(new Date()));if(view.type!=='home')return;}
  showView('home'); renderHome(); setHash('#home');
}
async function showWeek(st){
  st=st||weekStart; view={type:'week'};
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='week')return;
  showView('week'); renderAll(); setHash('#week-'+wk);
  const tabs=$('#weekTabs'); tabs.innerHTML='<button type="button" class="on" data-v="week">'+T('tab_week')+'</button><button type="button" data-v="growth">'+T('tab_growth')+'</button>';
  tabs.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v==='growth')showGrowth();};
}
async function showDay(k){
  view={type:'day',k};
  const st=mondayOf(parse(k));
  if(dkey(st)!==wk||!state)await loadWeek(st);
  if(view.type!=='day'||view.k!==k)return;
  $('#range').innerHTML=rangeLabel(weekStart);
  $('#banner').hidden=!hasExamples(state);
  renderDayPage(k); showView('day'); fitAll($('#viewDay')); setHash('#day-'+k);
}
function showWishes(openId){view={type:'wishes'};showView('wishes');renderWishes();setHash('#wishes');const ns=notifState();if(Date.now()-(ns.lastWishVisit||0)>864e5){ns.lastWishVisit=Date.now();queueDoc('profile',P);}if(openId){const w=wishes.find(x=>x.id===openId);if(w)openWish(w);}}
function showSettings(){view={type:'settings'};showView('settings');renderSettings();setHash('#settings');}
function route(){
  const h=(location.hash||'').slice(1);
  let m=h.match(/^day-(\d{4}-\d{2}-\d{2})$/); if(m)return showDay(m[1]);
  m=h.match(/^week-(\d{4}-\d{2}-\d{2})$/); if(m)return showWeek(mondayOf(parse(m[1])));
  if(h==='week')return showWeek(mondayOf(new Date()));
  m=h.match(/^wish-([A-Za-z0-9]+)$/); if(m)return showWishes(m[1]);
  if(h==='wishes')return showWishes();
  if(h==='settings')return showSettings();
  if(h==='style')return showStyle();
  if(h==='growth')return showGrowth();
  if(h==='admin')return showAdmin();
  if(h==='balance')return showBalance();
  if(h==='quiz'){return showHome().then(()=>runQuiz());}
  return showHome();
}
function currentHash(){return view.type==='day'?'day-'+view.k:view.type==='week'?'week-'+wk:view.type;}
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==currentHash())route();});
$('#prev').addEventListener('click',()=>showWeek(addDays(weekStart,-7)));
$('#next').addEventListener('click',()=>showWeek(addDays(weekStart,7)));
$('#today').addEventListener('click',()=>showWeek(mondayOf(new Date())));
$('#clearEx').addEventListener('click',()=>{clearExamples();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalEl){closeModal();return;}if(view.type==='day'){showWeek(weekStart);return;}}
  if(e.target.matches('input,textarea,select'))return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const dir=e.key==='ArrowLeft'?-1:1;
  if(view.type==='day')showDay(dkey(addDays(parse(view.k),dir)));else if(view.type==='week')showWeek(addDays(weekStart,7*dir));
});

/* ================= boot ================= */
(async function boot(){
  if(SB_ON){
    await store.init();
    if(!sbUser){ applyTheme(); applyLang(); showAuth('login'); setStatus('',T_("Войди, чтобы начать")); return; }
    await migrateGuest();
    const p=await store.loadDoc('profile'); P=p?normProfile(p):defaultProfile();
    if(syncLang())return;
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    wishes=await store.listWishes();
    let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
    if(!wishes.length&&!seen&&!P.onboarded)wishes=sampleWishes();
    await route(); if(await relocalizeExamples())await route();
    $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
    $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
    if(!P.onboarded)showOnboarding();
    idleStatus(); trackActivity(); outbox.flush();
    return;
  }
  try{const r=localStorage.getItem('planner.profile');if(r)P=normProfile(JSON.parse(r));}catch(e){}
  applyTheme(); paintAvatar(); applyLang();
  try{const bg=await idb.get('bg');if(bg&&bg.img){BG=bg;applyTheme();}}catch(e){}
  wishes=await store.listWishes();
  let seen=false; try{seen=!!localStorage.getItem('planner.seen');}catch(e){}
  if(!wishes.length&&!seen)wishes=sampleWishes();
  await route();                               // first paint from this browser
  $('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));
  $('#bell').addEventListener('click',openNotifCenter); paintBell(); setTimeout(()=>notifTick(false),1500);
  if(!P.onboarded)showOnboarding();
  idleStatus();
  await store.init();
  if(store.mode==='db'){
    const p=await store.loadDoc('profile'); if(p){P=normProfile(p);}
    if(syncLang())return;
    const bg=await store.loadDoc('bg'); if(bg&&bg.img)BG=bg;
    applyTheme(); paintAvatar(); applyLang();
    const ws=await store.listWishes(); if(ws.length||seen)wishes=ws;
    for(const k of Object.keys(cache))delete cache[k];   // reload from the account store
    wk=null; state=null; BAL=null;
    await route(); if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} idleStatus(); paintBell(); notifTick(false);
    if(P.onboarded&&!$('#onbHost').querySelector('.quiz'))$('#onbHost').innerHTML='';
  } else { if(syncLang())return; if(await relocalizeExamples()){await route();$('#banner').hidden=!(hasExamples(state)||wishes.some(w=>w.ex));} }
})();

})();
</script>
